SLIDES[4].html = "<div class=\"inner\" style=\"max-width:1160px;\"><div class=\"kicker\">판단 · 3축</div><div class=\"h2\" style=\"font-size:25px;\">Agent로 만들 일인가</div><div class=\"sub\">아래 세 질문에 <strong>모두 ‘예’</strong>일 때 Agent로 만듭니다.</div><div class=\"demo\" style=\"margin-top:16px;padding:20px 18px;\"><div class=\"dlbl\">3분 판단 순서</div><div style=\"display:grid;grid-template-columns:1fr 28px 1fr 28px 1fr;gap:7px;align-items:center;\"><div class=\"card bl\" style=\"min-height:150px;text-align:center;\"><div class=\"sn\" style=\"margin:0 auto 12px;\">1</div><div class=\"ctag bl\">반복</div><div class=\"ct\">월 4회 이상?</div><div class=\"cb\">계속 다시 하는 일인가</div></div><div style=\"text-align:center;color:#A78BFA;font-size:22px;\">→</div><div class=\"card pu\" style=\"min-height:150px;text-align:center;\"><div class=\"sn\" style=\"margin:0 auto 12px;\">2</div><div class=\"ctag pu\">단계</div><div class=\"ct\">3단계 이상?</div><div class=\"cb\">한 번에 끝나지 않는가</div></div><div style=\"text-align:center;color:#A78BFA;font-size:22px;\">→</div><div class=\"card am\" style=\"min-height:150px;text-align:center;\"><div class=\"sn\" style=\"margin:0 auto 12px;background:#D97706;\">3</div><div class=\"ctag am\">기준</div><div class=\"ct\">합격 기준을 쓸 수 있나?</div><div class=\"cb\">잘했는지 확인할 수 있는가</div></div></div></div><div class=\"g3\" style=\"margin-top:14px;\"><div class=\"card gr\"><div class=\"ctag gr\">세 개 모두 예</div><div class=\"ct\">Agent</div><div class=\"cb\">반복 업무를 순서대로 맡깁니다.</div></div><div class=\"card pu\"><div class=\"ctag pu\">반복만 예</div><div class=\"ct\">Skill</div><div class=\"cb\">방법만 문서로 만들어 둡니다.</div></div><div class=\"card sl\"><div class=\"ctag sl\">한 번만 하는 일</div><div class=\"ct\">그냥 대화</div><div class=\"cb\">Agent를 만들지 않아도 됩니다.</div></div></div></div>";
// 순서: 구체적인 회의록 예시를 먼저, 그다음 Agent 판단 3축으로 일반화한다.

function fallback(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e) { alert('복사에 실패했습니다. 직접 선택해서 복사해주세요.'); }
  document.body.removeChild(ta);
}
const stage = document.getElementById('stage');
const dotsEl = document.getElementById('dots');
let cur = 0, notesOpen = false, tx = 0;

document.getElementById('tot').textContent = SLIDES.length;
SLIDES.forEach((s, i) => {
  const div = document.createElement('div');
  div.className = 'slide';
  div.id = 'sl' + i;
  div.innerHTML = s.html;
  div.querySelectorAll('pre.prompt').forEach(pre => {
    const wrap = document.createElement('div');
    wrap.className = 'promptwrap';
    pre.parentNode.insertBefore(wrap, pre);
    wrap.appendChild(pre);
    const btn = document.createElement('button');
    btn.className = 'copybtn';
    btn.type = 'button';
    btn.textContent = '복사';
    btn.onclick = () => {
      const txt = pre.innerText;
      const done = () => { btn.textContent = '복사됨'; btn.classList.add('done');
        setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('done'); }, 1600); };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(txt).then(done).catch(() => fallback(txt, done));
      } else { fallback(txt, done); }
    };
    wrap.appendChild(btn);
  });
  stage.appendChild(div);
  const dot = document.createElement('button');
  dot.className = 'dot' + (i === 0 ? ' on' : '');
  dot.onclick = () => show(i);
  dotsEl.appendChild(dot);
});

function show(idx){
  idx = Math.max(0, Math.min(SLIDES.length - 1, idx));
  const prev = document.getElementById('sl' + cur);
  const next = document.getElementById('sl' + idx);
  if (prev && prev !== next) { prev.classList.remove('active'); prev.classList.add('exit'); setTimeout(() => prev.classList.remove('exit'), 380); }
  cur = idx;
  next.classList.remove('exit');
  next.classList.add('active');
  document.getElementById('cur').textContent = cur + 1;
  document.getElementById('pf').style.width = ((cur + 1) / SLIDES.length * 100) + '%';
  document.getElementById('notesText').textContent = SLIDES[cur].notes || '—';
  document.getElementById('btnP').disabled = cur === 0;
  document.getElementById('btnN').disabled = cur === SLIDES.length - 1;
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === cur));
  next.querySelectorAll('.demo, .demo *').forEach(el => { const a = el.style.animation; el.style.animation='none'; void el.offsetWidth; el.style.animation=a || ''; });
}
function go(d){ show(cur + d); }
function toggleNotes(){
  notesOpen = !notesOpen;
  document.getElementById('notesPanel').classList.toggle('open', notesOpen);
  document.getElementById('noteBtn').classList.toggle('on', notesOpen);
}
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); go(-1); }
  if (e.key === 'Escape' && notesOpen) toggleNotes();
  if (e.key === 'n' || e.key === 'N') toggleNotes();
});
stage.addEventListener('touchstart', e => tx = e.touches[0].clientX);
stage.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); });
show(0);
</script>
