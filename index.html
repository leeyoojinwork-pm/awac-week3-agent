<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>내 업무 멀티에이전트 만들기 — 60분 입문 특강 | 이유진</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;}
body{background:#0D1117;display:flex;flex-direction:column;}

/* ── Top bar ── */
.topbar{height:46px;flex-shrink:0;background:rgba(13,17,23,.97);border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;padding:0 22px;gap:12px;}
.tb-badge{background:#7C3AED;color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:99px;}
.tb-title{font-size:13px;font-weight:700;color:rgba(255,255,255,.7);}
.tb-meta{font-size:11.5px;color:rgba(255,255,255,.3);}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
.tb-btn{background:none;border:1px solid rgba(255,255,255,.15);border-radius:5px;color:rgba(255,255,255,.45);font-size:11px;padding:4px 10px;cursor:pointer;transition:all .15s;}
.tb-btn:hover{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.3);}
.tb-btn.on{background:rgba(124,58,237,.2);border-color:#7C3AED;color:#C4B5FD;}
.dots{display:flex;gap:7px;align-items:center;}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.18);cursor:pointer;transition:all .2s;border:none;}
.dot.on{background:#7C3AED;transform:scale(1.3);}
.counter{font-size:12px;color:rgba(255,255,255,.3);font-variant-numeric:tabular-nums;}

/* ── Progress ── */
.progress{height:3px;background:rgba(255,255,255,.06);flex-shrink:0;}
.pfill{height:100%;background:linear-gradient(90deg,#7C3AED,#A78BFA);transition:width .4s cubic-bezier(.22,1,.36,1);}

/* ── Stage ── */
.stage{flex:1;position:relative;overflow:hidden;}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 64px;opacity:0;transform:translateX(56px);transition:opacity .35s cubic-bezier(.22,1,.36,1),transform .35s cubic-bezier(.22,1,.36,1);pointer-events:none;overflow-y:auto;}
.slide.active{opacity:1;transform:translateX(0);pointer-events:auto;}
.slide.exit{opacity:0;transform:translateX(-56px);}
.inner{width:100%;max-width:840px;}

/* ── Nav arrows ── */
.arr{position:fixed;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;z-index:10;}
.arr:hover{background:rgba(255,255,255,.12);color:#fff;}
.arr:disabled{opacity:.15;cursor:default;}
.arr.p{left:13px;}
.arr.n{right:13px;}

/* ── Notes ── */
.notes{position:fixed;bottom:0;left:0;right:0;background:rgba(8,12,20,.97);border-top:1px solid rgba(255,255,255,.1);padding:13px 24px;font-size:12.5px;color:rgba(255,255,255,.55);line-height:1.7;transform:translateY(100%);transition:transform .28s;max-height:140px;overflow-y:auto;}
.notes.open{transform:translateY(0);}
.nlbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#A78BFA;margin-bottom:5px;}

/* ── Text ── */
.kicker{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7C3AED;margin-bottom:10px;}
.h1{font-size:36px;font-weight:900;color:#fff;line-height:1.2;margin-bottom:12px;}
.h2{font-size:23px;font-weight:800;color:#fff;line-height:1.3;margin-bottom:5px;}
.sub{font-size:13px;color:rgba(255,255,255,.38);margin-bottom:18px;line-height:1.6;}

/* ── Cards ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.card{border-radius:10px;padding:16px 18px;}
.card.pu{background:rgba(124,58,237,.14);border:1px solid rgba(124,58,237,.32);}
.card.bl{background:rgba(37,99,235,.14);border:1px solid rgba(37,99,235,.32);}
.card.rd{background:rgba(185,28,28,.13);border:1px solid rgba(185,28,28,.28);}
.card.am{background:rgba(180,83,9,.16);border:1px solid rgba(252,211,77,.3);}
.card.gr{background:rgba(5,150,105,.13);border:1px solid rgba(5,150,105,.3);}
.card.sl{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);}
.ctag{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px;}
.ctag.pu{color:#C4B5FD;}.ctag.bl{color:#93C5FD;}.ctag.rd{color:#FCA5A5;}.ctag.am{color:#FCD34D;}.ctag.gr{color:#6EE7B7;}.ctag.sl{color:rgba(255,255,255,.35);}
.ct{font-size:15px;font-weight:700;color:#fff;margin-bottom:5px;line-height:1.35;}
.cb{font-size:13px;color:rgba(255,255,255,.58);line-height:1.75;}

/* ── BA ── */
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.bef{background:rgba(185,28,28,.12);border:1px solid rgba(185,28,28,.28);border-radius:8px;padding:14px 16px;}
.aft{background:rgba(124,58,237,.13);border:1px solid rgba(124,58,237,.32);border-radius:8px;padding:14px 16px;}
.balbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px;}
.balbl.b{color:#FCA5A5;}.balbl.a{color:#C4B5FD;}
.batask{font-size:14px;font-weight:700;color:#fff;margin-bottom:6px;line-height:1.35;}
.babody{font-size:12.5px;color:rgba(255,255,255,.52);line-height:1.75;}

/* ── Callout ── */
.cl{border-radius:8px;padding:12px 16px;font-size:13.5px;line-height:1.75;margin-top:11px;}
.cl.pu{background:rgba(124,58,237,.14);border-left:3px solid #7C3AED;color:#DDD6FE;}
.cl.bl{background:rgba(37,99,235,.14);border-left:3px solid #2563EB;color:#BAE6FD;}
.cl.am{background:rgba(180,83,9,.16);border-left:3px solid #D97706;color:#FDE68A;}
.cl.gr{background:rgba(5,150,105,.13);border-left:3px solid #10B981;color:#6EE7B7;}

/* ── Step ── */
.step{display:flex;gap:12px;align-items:flex-start;padding:11px 15px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);margin-bottom:8px;}
.sn{width:26px;height:26px;border-radius:50%;background:#7C3AED;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.st{font-size:13.5px;color:rgba(255,255,255,.73);line-height:1.7;}
.st strong{color:#fff;}

/* ── Rule tag ── */
.rtag{display:inline-flex;align-items:center;gap:5px;background:rgba(124,58,237,.18);border:1px solid rgba(124,58,237,.35);border-radius:5px;padding:3px 9px;font-size:11.5px;color:#C4B5FD;font-weight:600;margin:2px 3px 2px 0;}

/* ── Skill pill ── */
.skill{display:inline-block;background:rgba(37,99,235,.2);border:1px solid rgba(37,99,235,.4);border-radius:5px;padding:3px 10px;font-family:monospace;font-size:12.5px;color:#93C5FD;font-weight:700;margin:2px;}

/* ── Flow ── */
.flow{display:flex;align-items:center;gap:0;overflow-x:auto;}
.fnode{flex-shrink:0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:12px 14px;text-align:center;min-width:110px;}
.farr{flex-shrink:0;color:rgba(255,255,255,.25);padding:0 6px;}

/* ── Table ── */
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl thead th{background:rgba(255,255,255,.07);color:rgba(255,255,255,.4);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:8px 13px;text-align:left;}
.tbl td{padding:9px 13px;color:rgba(255,255,255,.68);border-bottom:1px solid rgba(255,255,255,.06);}
.tbl tr:last-child td{border-bottom:none;}
.tbl .done{color:#6EE7B7;font-weight:600;}
.tbl .wip{color:#FCD34D;}
.tbl .warn{color:#FCA5A5;}

/* ── Big message ── */
.bigmsg{background:linear-gradient(135deg,rgba(124,58,237,.18),rgba(37,99,235,.15));border:1.5px solid rgba(124,58,237,.38);border-radius:12px;padding:22px 28px;text-align:center;margin-top:14px;}
.bmlbl{font-size:11px;color:rgba(255,255,255,.35);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px;}
.bmtxt{font-size:18px;font-weight:800;color:#fff;line-height:1.6;}
.bmtxt .hl{color:#A78BFA;}

/* ── Time badge ── */
.tbadge{display:inline-block;background:rgba(124,58,237,.18);border:1px solid rgba(124,58,237,.3);border-radius:99px;padding:3px 11px;font-size:11px;font-weight:700;color:#C4B5FD;margin-right:6px;}

/* cover pills */
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;}
.pill{padding:5px 14px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(124,58,237,.14);color:#C4B5FD;border:1px solid rgba(124,58,237,.32);}

/* v4 자연스러운 문장/간격 보정 */
.slide{overflow-y:auto}
.paper{max-height:calc(100vh - 128px);overflow-y:auto}
.h1,.h2,.h3{word-break:keep-all}
.sub,.cbody,.small,.step span,.st,.cb,.callout,.cl{word-break:keep-all}
.cbody,.cb{line-height:1.66}
.step{align-items:flex-start}
.grid3 .card{min-height:0}
.table td,.tbl td{word-break:keep-all}
@media(max-height:760px){
  .paper{padding:34px 42px}
  .h1{font-size:42px}
  .h2{font-size:30px}
  .sub{font-size:18px;margin-top:12px}
  .card{padding:20px}
  .callout{font-size:16px;padding:16px 20px}
}


/* ── 복붙 프롬프트 블록 ── */
pre.prompt{background:rgba(8,12,20,.85);border:1px solid rgba(124,58,237,.3);border-left:3px solid #7C3AED;
  border-radius:9px;padding:18px 22px;margin-top:14px;
  font-family:"SFMono-Regular",Menlo,Consolas,monospace;font-size:13px;line-height:1.72;
  color:rgba(255,255,255,.82);white-space:pre-wrap;overflow-x:auto;}
.promptwrap{position:relative;}
.promptwrap pre.prompt{padding-right:104px;}
.copybtn{position:absolute;top:22px;right:12px;z-index:3;
  font-family:inherit;font-size:11.5px;font-weight:700;letter-spacing:.2px;
  color:#C4B5FD;background:rgba(124,58,237,.16);border:1px solid rgba(124,58,237,.45);
  border-radius:7px;padding:5px 11px;cursor:pointer;transition:all .15s;}
.copybtn:hover{background:rgba(124,58,237,.34);color:#fff;}
.copybtn.done{background:rgba(16,185,129,.2);border-color:rgba(16,185,129,.55);color:#6EE7B7;}
.ba{grid-template-columns:1fr 1fr;}
.flow{justify-content:center;}
.inner{max-width:900px;}
.tbl td strong{color:#fff;}
.cl strong{color:#fff;}

html,body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;}

.panelshot{display:inline-block;position:relative;margin-top:10px;border:1px solid rgba(255,255,255,.12);border-radius:10px;overflow:hidden;background:#fff;line-height:0;}
.panelshot img{display:block;max-height:530px;max-width:100%;width:auto;height:auto;}
.bdg{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;
  box-shadow:0 0 0 3px rgba(13,17,23,.55);}
.bdg.on{background:#7C3AED;color:#fff;}
.bdg.off{background:#94A3B8;color:#0D1117;}
.bdg.alt{background:#F59E0B;color:#0D1117;}

/* ── 실습 미리보기 애니메이션 ── */
.demo{background:#0B0F16;border:1px solid rgba(255,255,255,.13);border-radius:10px;padding:14px 16px;font-size:12.5px;color:rgba(255,255,255,.75);}
.demo .dlbl{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#A78BFA;margin-bottom:10px;}
.demo .mono{font-family:"SFMono-Regular",Menlo,Consolas,monospace;}
.fline{opacity:0;transform:translateY(-6px);display:flex;align-items:center;gap:7px;padding:4px 0;}
.slide.active .fline{animation:fin .45s ease forwards;}
@keyframes fin{to{opacity:1;transform:translateY(0);}}
.fline i{width:13px;height:13px;border-radius:3px;background:#475569;flex:none;font-style:normal;}
.fline.fo i{background:#7C3AED;}
.fline.fn i{background:#10B981;}
.bubble{background:rgba(124,58,237,.16);border:1px solid rgba(124,58,237,.34);border-radius:9px;padding:9px 12px;margin-bottom:8px;opacity:0;}
.slide.active .bubble{animation:fin .5s ease forwards;}
.card-pop{opacity:0;transform:scale(.9);}
.slide.active .card-pop{animation:pop .5s cubic-bezier(.2,1.3,.4,1) forwards;}
@keyframes pop{to{opacity:1;transform:scale(1);}}
.typing{display:inline-block;overflow:hidden;white-space:nowrap;width:0;vertical-align:bottom;}
.slide.active .typing{animation:tw 1.6s steps(34,end) forwards;}
@keyframes tw{to{width:100%;}}
.slotrow{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.slotrow b{color:rgba(255,255,255,.5);font-size:11.5px;}
.slotval{position:relative;height:15px;}
.slotval .ph{position:absolute;inset:0;color:rgba(255,255,255,.28);}
.slotval .rv{position:absolute;inset:0;opacity:0;color:#6EE7B7;}
.slide.active .slotval .ph{animation:fout .3s ease forwards;}
.slide.active .slotval .rv{animation:fin .4s ease forwards;}
@keyframes fout{to{opacity:0;}}
.slotrow.ask .slotval .rv{color:#FCD34D;}
.agbox{border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:11px 13px;background:rgba(255,255,255,.03);transition:none;}
.slide.active .agbox.a1{animation:glow 1.1s ease .2s forwards;}
.slide.active .agbox.a2{animation:glow 1.1s ease 2.0s forwards;}
@keyframes glow{0%{border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.03);}
  45%{border-color:#7C3AED;background:rgba(124,58,237,.2);box-shadow:0 0 0 3px rgba(124,58,237,.14);}
  100%{border-color:rgba(124,58,237,.45);background:rgba(124,58,237,.1);box-shadow:none;}}
.deskwrap{display:flex;gap:26px;justify-content:center;align-items:flex-end;padding:18px 0 6px;}
.desk{text-align:center;}
.guy{width:38px;height:44px;margin:0 auto 5px;border-radius:9px 9px 4px 4px;position:relative;}
.guy:after{content:"";position:absolute;left:9px;top:8px;width:20px;height:9px;border-radius:3px;background:rgba(0,0,0,.35);}
.slide.active .guy.g1{animation:tap .5s ease-in-out .3s infinite;}
.slide.active .guy.g2{animation:tap .5s ease-in-out 2.2s infinite;}
@keyframes tap{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
.deskplate{width:66px;height:7px;border-radius:3px;background:#334155;margin:0 auto;}
.say{position:relative;margin:0 auto 6px;width:max-content;background:#fff;color:#0D1117;font-size:10.5px;font-weight:800;
  padding:4px 9px;border-radius:9px;opacity:0;}
.slide.active .say{animation:fin .4s ease 3.4s forwards;}

/* ── 오늘 파이프라인 ── */
.pipe{display:flex;align-items:stretch;justify-content:center;gap:0;margin-top:16px;}
.pstep{flex:1;min-width:0;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
  border-radius:10px;padding:13px 11px;text-align:center;}
.pstep.hot{background:rgba(124,58,237,.14);border-color:rgba(124,58,237,.45);}
.pn{font-size:10px;font-weight:800;letter-spacing:.08em;color:rgba(255,255,255,.4);margin-bottom:6px;}
.pstep.hot .pn{color:#C4B5FD;}
.pt{font-size:14px;font-weight:800;color:#fff;line-height:1.3;margin-bottom:6px;}
.pf{font-family:"SFMono-Regular",Menlo,monospace;font-size:10.5px;color:#6EE7B7;line-height:1.5;min-height:30px;}
.pppl{display:flex;gap:5px;justify-content:center;margin:9px 0 5px;height:26px;align-items:flex-end;}
.pppl span{width:15px;height:20px;border-radius:5px 5px 2px 2px;display:block;}
.pppl .p1{background:#60A5FA;}
.pppl .p2{background:#C4B5FD;}
.pppl .ghost{width:15px;height:20px;border:1px dashed rgba(255,255,255,.25);background:none;color:rgba(255,255,255,.3);
  font-size:11px;line-height:20px;text-align:center;border-radius:5px;}
.pcap{font-size:10.5px;color:rgba(255,255,255,.45);}
.pstep.hot .pcap{color:#C4B5FD;font-weight:700;}
.parr{display:flex;align-items:center;color:rgba(255,255,255,.25);font-size:15px;padding:0 5px;flex:none;}
</style>
</head>
<body>

<div class="topbar">
  <span class="tb-badge">입문 60분</span>
  <span class="tb-title">멀티에이전트 만들기 — AI 둘이 나눠서 일하게</span>
  <span class="tb-meta">· 60분 · 이유진</span>
  <div class="tb-right">
    <div class="dots" id="dots"></div>
    <span class="counter"><span id="cur">1</span> / <span id="tot">0</span></span>
    <button class="tb-btn" id="noteBtn" onclick="toggleNotes()">발표 노트</button>
  </div>
</div>
<div class="progress"><div class="pfill" id="pf"></div></div>

<div class="stage" id="stage"></div>
<button class="arr p" id="btnP" onclick="go(-1)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3l-5 5 5 5"/></svg></button>
<button class="arr n" id="btnN" onclick="go(1)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3l5 5-5 5"/></svg></button>

<div class="notes" id="notesPanel">
  <div class="nlbl">발표 노트</div>
  <div id="notesText"></div>
</div>

<script>
const SLIDES = [
{notes:"제목에 멀티에이전트가 들어가 있지만 겁먹지 않게 바로 풀어준다. AI 둘이 나눠서 일하게 만드는 것, 그 이상도 이하도 아니라고. 어려운 이름은 오늘 딱 한 번만 쓴다고 말해두면 편해진다.",html:"<div class=\"inner\" style=\"text-align:center;\">\n  <div class=\"kicker\">AI 처음 쓰는 분을 위한 60분</div>\n  <div class=\"h1\">내 업무 멀티에이전트<br/>만들기</div>\n  <div class=\"bigmsg\" style=\"max-width:720px;margin:20px auto 0;\"><div class=\"bmlbl\">어려운 이름이지만 뜻은 간단합니다</div><div class=\"bmtxt\"><span class=\"hl\">AI 둘이 나눠서 일하게 만드는 것.</span><br/>한 명은 만들고, 한 명은 그걸 검사합니다.</div></div>\n  <div class=\"pills\" style=\"justify-content:center;\">\n    <span class=\"pill\">agent 1 세우기</span>\n    <span class=\"pill\">일하는 순서 주기</span>\n    <span class=\"pill\">agent 2 붙이기</span>\n    <span class=\"pill\">둘이 일하는 걸 보기</span>\n  </div>\n  <div style=\"margin-top:20px;font-size:12.5px;color:rgba(255,255,255,.3);\">이유진 · AX 컨설턴트 / B2B AI 강사</div>\n</div>"},
{notes:"첫 줄에서 못을 박는다 — 문제정의·지침서는 지난주에 끝났고 오늘은 에이전트를 만든다. 준비 11분은 빠르게 통과한다고 미리 말해두면 수강생이 조급해하지 않는다. 가운데 36분이 오늘의 전부다.",html:"<div class=\"inner\" style=\"max-width:1100px;\">\n  <div class=\"kicker\">오늘 흐름</div>\n  <div class=\"h2\" style=\"font-size:25px;\">에이전트를 만들고, 멀티에이전트까지 갑니다</div>\n  <div class=\"sub\">지난주에 한 문제정의와 배경 정리는 오늘 <strong>재료로만</strong> 씁니다. 오늘 만드는 건 에이전트입니다.</div>\n  <table class=\"tbl\" style=\"margin-top:10px;\">\n    <thead><tr><th style=\"width:105px\">시간</th><th style=\"width:150px\">블록</th><th>하는 일</th><th style=\"width:170px\">agent 수</th></tr></thead>\n    <tbody>\n      <tr><td>00:00–00:05</td><td>열기</td><td>에이전트가 뭔지</td><td class=\"wip\">agent 0</td></tr>\n      <tr><td>00:05–00:16</td><td>준비</td><td class=\"dim\">지난주 것 들고 와서 방 하나 세팅 — <strong>오늘 내용 아님</strong></td><td class=\"wip\">agent 0</td></tr>\n      <tr class=\"focal\"><td class=\"done\">00:16–00:36</td><td class=\"done\"><strong>에이전트 만들기</strong></td><td class=\"done\">일하는 순서를 쥐여주고 <strong>실제로 한 번 돌립니다</strong></td><td class=\"done\"><strong>agent 1</strong></td></tr>\n      <tr class=\"focal\"><td class=\"done\">00:36–00:52</td><td class=\"done\"><strong>멀티에이전트 만들기</strong></td><td class=\"done\">방을 하나 더 열어 검사를 맡깁니다</td><td class=\"done\"><strong>agent 2 · 목적지</strong></td></tr>\n      <tr><td>00:52–00:56</td><td>시연</td><td>둘이 일하는 모습을 눈으로 본다</td><td class=\"wip\">agent 2</td></tr>\n      <tr><td>00:56–01:00</td><td>마무리</td><td>지킬 것, 다음 주 발표</td><td class=\"wip\">—</td></tr>\n    </tbody>\n  </table>\n  <div class=\"cl pu\">앞의 <strong>준비 11분</strong>은 지난주에 이미 하신 겁니다. 오늘 새로 배우는 건 <strong>가운데 36분</strong>입니다.</div>\n</div>"},
{notes:"네 칸으로 줄였다. 첫 칸은 지난주 것이라 빨리 지나간다고 말한다. 가운데 두 칸이 오늘이다.",html:"<div class=\"inner\" style=\"max-width:1150px;\">\n  <div class=\"kicker\">오늘 만들어지는 것</div>\n  <div class=\"h2\" style=\"font-size:25px;\">에이전트 하나를 완성하고, 하나를 더 붙입니다</div>\n  <div class=\"pipe\">\n    <div class=\"pstep\"><div class=\"pn\">준비</div><div class=\"pt\">지난주 것 들고오기</div><div class=\"pf\">background.md · 폴더 4칸</div><div class=\"pppl\"><span class=\"ghost\">?</span></div><div class=\"pcap\">지난주에 한 것</div></div>\n    <div class=\"parr\">→</div>\n    <div class=\"pstep hot\"><div class=\"pn\">오늘 ①</div><div class=\"pt\">에이전트 만들기</div><div class=\"pf\">SKILL.md → draft.md</div><div class=\"pppl\"><span class=\"p1\"></span></div><div class=\"pcap\">agent 1 · 실제로 일함</div></div>\n    <div class=\"parr\">→</div>\n    <div class=\"pstep hot\"><div class=\"pn\">오늘 ②</div><div class=\"pt\">멀티에이전트 만들기</div><div class=\"pf\">방 2개 → review.md</div><div class=\"pppl\"><span class=\"p1\"></span><span class=\"p2\"></span></div><div class=\"pcap\">agent 2 · 목적지</div></div>\n    <div class=\"parr\">→</div>\n    <div class=\"pstep\"><div class=\"pn\">시연</div><div class=\"pt\">일하는 모습 보기</div><div class=\"pf\">픽셀 사무실</div><div class=\"pppl\"><span class=\"p1\"></span><span class=\"p2\"></span></div><div class=\"pcap\">agent 2 · 눈으로 확인</div></div>\n  </div>\n  <div class=\"bigmsg\"><div class=\"bmlbl\">오늘 새로 만드는 것</div><div class=\"bmtxt\">가운데 두 칸입니다. 첫 칸은 <span class=\"hl\">지난주에 이미 하신 것</span>이고,<br/>오늘은 그걸 <span class=\"hl\">실제로 일하는 에이전트</span>로 바꿉니다.</div></div>\n</div>"},
{notes:"가장 중요한 장. 못 알아듣는 건 수강생 잘못이 아니라 내 설명이 빠른 거라고 말해준다. 지난주 기억 안 나는 것도 정상이라고 여기서 풀어준다.",html:"<div class=\"inner\">\n  <div class=\"kicker\">시작 전 약속</div>\n  <div class=\"h2\">세 가지만 약속하고 갑시다</div>\n  <div style=\"margin-top:16px;\">\n    <div class=\"step\"><div class=\"sn\">1</div><div class=\"st\"><strong>모르는 단어가 나오면 바로 손 드세요</strong><br/>못 알아듣는 건 여러분 잘못이 아니라 제 설명이 빨랐던 겁니다.</div></div>\n    <div class=\"step\"><div class=\"sn\">2</div><div class=\"st\"><strong>외우지 마세요</strong><br/>화면에 나오는 글을 복사해서 붙이기만 하면 됩니다. 타자 칠 일 거의 없습니다.</div></div>\n    <div class=\"step\"><div class=\"sn\">3</div><div class=\"st\"><strong>잘 만들려고 하지 마세요</strong><br/>오늘은 잘 만드는 날이 아니라 <strong>한 번 돌아가는 걸 보는 날</strong>입니다.</div></div>\n  </div>\n  <div class=\"cl pu\" style=\"margin-bottom:10px;\"><strong>멀티에이전트</strong>라는 말은 오늘 딱 한 번만 쓰겠습니다. 뜻은 <strong>AI 둘이 나눠서 일하는 것</strong>. 그게 전부입니다.</div>\n  \n</div>"},
{notes:"비유를 팀으로 확장한다. 신입 한 명 세우는 것까지가 절반이고, 짝을 붙이는 게 오늘의 나머지 절반이다. 마지막 줄에서 왜 한 명으로는 안 되는지 반드시 짚는다.",html:"<div class=\"inner\" style=\"max-width:1100px;\">\n  <div class=\"kicker\">멀티에이전트가 무슨 말이냐면</div>\n  <div class=\"h2\" style=\"font-size:25px;\">AI를 <strong>매일 아침 기억을 잃는 신입</strong>이라고 생각해보세요</div>\n  <div class=\"g3\" style=\"margin-top:14px;\">\n    <div class=\"card rd\"><div class=\"ctag rd\">지금까지</div><div class=\"ct\">매일 처음부터 다시</div><div class=\"cb\">어제 알려준 걸 오늘 또 알려줍니다. 자리도 없고 안내문도 없으니 매번 새로 설명해야 합니다.</div></div>\n    <div class=\"card bl\"><div class=\"ctag bl\">오늘 앞부분</div><div class=\"ct\">첫 agent을 앉힙니다</div><div class=\"cb\">책상을 주고, 업무 안내문을 써주고, 일하는 순서를 쥐여줍니다. 이제 설명 없이도 일합니다.</div></div>\n    <div class=\"card pu\"><div class=\"ctag pu\">오늘 뒷부분</div><div class=\"ct\">짝을 붙입니다</div><div class=\"cb\">그런데 혼자면 자기가 만든 걸 자기가 봅니다. <strong>검사하는 사람을 한 명 더</strong> 앉힙니다.</div></div>\n  </div>\n  <div class=\"bigmsg\"><div class=\"bmlbl\">왜 한 명으로는 안 되냐면</div><div class=\"bmtxt\">만드는 사람과 의심하는 사람이 <span class=\"hl\">한 머리에 있으면 반드시 섞입니다.</span><br/>그래서 오늘 둘로 나눕니다.</div></div>\n</div>"},
{notes:"2주차에서 이미 나눠준 판단 3축. 오늘은 복습으로 30초만 짚는다. 셋 다 해당해야 Agent, 반복만이면 Skill, 기준이 없으면 기준부터, 한 번만 하는 일이면 그냥 대화. 오늘 실습은 '셋 다 해당한다'고 가정하고 간다고 말하고 넘어간다.",html:"<div class=\"inner\" style=\"max-width:1100px;\">\n  <div class=\"kicker\">시작 전에 · 2주차 복습 30초</div>\n  <div class=\"h2\" style=\"font-size:25px;\">모든 업무를 에이전트로 만들 필요는 없습니다</div>\n  <div class=\"sub\">만들기 전에 세 축으로 먼저 봅니다. <strong>셋 다 해당할 때만</strong> 에이전트입니다.</div>\n  <div class=\"g3\" style=\"margin-top:14px;\">\n    <div class=\"card bl\"><div class=\"ctag bl\">반복</div><div class=\"ct\">월 4회 이상 돌아오나</div><div class=\"cb\">한 번 만들어 계속 쓸 만큼 반복되는 일인가</div></div>\n    <div class=\"card pu\"><div class=\"ctag pu\">단계</div><div class=\"ct\">3단계 이상인가</div><div class=\"cb\">한 번에 끝나는 일이면 굳이 구조를 만들 필요가 없습니다</div></div>\n    <div class=\"card am\"><div class=\"ctag am\">규격</div><div class=\"ct\">합격 기준을 글로 적을 수 있나</div><div class=\"cb\">기준이 없으면 에이전트가 자기 결과를 점검할 수 없습니다</div></div>\n  </div>\n  <table class=\"tbl\" style=\"margin-top:14px;font-size:12.5px;\">\n    <thead><tr><th style=\"width:230px\">판단 결과</th><th style=\"width:150px\">그럼 뭘 만드나</th><th>이유</th></tr></thead>\n    <tbody>\n      <tr class=\"focal\"><td class=\"done\">반복 + 단계 + 규격 모두</td><td class=\"done\"><strong>Agent</strong></td><td class=\"done\">스스로 진행하고 결과까지 점검할 구조가 필요합니다</td></tr>\n      <tr><td>반복만 있음</td><td>Skill</td><td>주체를 새로 만들기보다 절차서 한 장으로 충분합니다</td></tr>\n      <tr><td>단계는 있는데 기준이 없음</td><td class=\"warn\">기준 정리 먼저</td><td>점검할 기준이 없으면 만들어도 흔들립니다</td></tr>\n      <tr><td>한 번만 하는 일</td><td>그냥 대화</td><td>재사용할 게 없으면 굳힐 필요가 없습니다</td></tr>\n    </tbody>\n  </table>\n  <div class=\"cl pu\">오늘 실습은 <strong>셋 다 해당하는 업무</strong>를 골랐다고 보고 갑니다. 아니어도 만들어보는 게 오늘 목적입니다.</div>\n</div>"},
{notes:"'멀티에이전트 굳이 해야 하나요'에 답하는 장표. 취준 예시라 전원이 안다. 왼쪽 트리에서 방(agent)과 방법(skill)의 차이를 색으로 구분해 보여준다. 오른쪽 세 줄이 답이다 — 섞이면 안 되는 판단이 두 개 이상일 때만 나눈다. 일이 하나면 안 나눠도 된다고 먼저 인정해주는 게 중요하다. 그래야 나머지를 믿는다. 오늘 실습은 이 그림의 가장 작은 버전(방 2개)이라고 연결하고 넘어간다.",html:"<div class=\"inner\" style=\"max-width:1150px;\">\n  <div class=\"kicker\">그런데 굳이 나눠야 하나요?</div>\n  <div class=\"h2\" style=\"font-size:25px;\">일이 하나면 안 나눠도 됩니다. 두 개면 얘기가 다릅니다</div>\n  <div style=\"display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:start;margin-top:12px;\">\n    <div class=\"demo\" style=\"padding:14px 16px;\">\n      <div class=\"dlbl\">예를 들어 — 취업 준비를 맡긴다면</div>\n      <div style=\"background:rgba(0,0,0,.26);border-radius:9px;padding:12px 14px;\"><div class=\"fline\" style=\"animation-delay:0.3s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;\"><span class=\"mono\" style=\"font-size:13.5px;white-space:pre;color:#fff;font-weight:800;\">취준 에이전트</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">큰 일 하나</span></div><div class=\"fline\" style=\"animation-delay:0.42s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;\"><span class=\"mono\" style=\"font-size:13.5px;white-space:pre;color:#C4B5FD;font-weight:700;\">├── 이력서 agent</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">이력서만 봅니다<span style=\"margin-left:9px;font-size:9.5px;font-weight:800;background:rgba(124,58,237,.3);color:#C4B5FD;border-radius:4px;padding:1px 6px;\">방 = agent</span></span></div><div class=\"fline\" style=\"animation-delay:0.54s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;\"><span class=\"mono\" style=\"font-size:13.5px;white-space:pre;color:rgba(110,231,183,.85);font-weight:600;\">│   ├── JD 분석 스킬</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">공고에서 요구사항을 뽑는 방법<span style=\"margin-left:9px;font-size:9.5px;font-weight:800;background:rgba(16,185,129,.18);color:rgba(110,231,183,.9);border-radius:4px;padding:1px 6px;\">방법 = skill</span></span></div><div class=\"fline\" style=\"animation-delay:0.6599999999999999s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;\"><span class=\"mono\" style=\"font-size:13.5px;white-space:pre;color:rgba(110,231,183,.85);font-weight:600;\">│   └── 이력서 맞춤 스킬</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">내 경험을 그 요구사항에 붙이는 방법<span style=\"margin-left:9px;font-size:9.5px;font-weight:800;background:rgba(16,185,129,.18);color:rgba(110,231,183,.9);border-radius:4px;padding:1px 6px;\">방법 = skill</span></span></div><div class=\"fline\" style=\"animation-delay:0.78s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;\"><span class=\"mono\" style=\"font-size:13.5px;white-space:pre;color:#C4B5FD;font-weight:700;\">└── 면접 agent</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">이력서 결과물만 받아서 봅니다<span style=\"margin-left:9px;font-size:9.5px;font-weight:800;background:rgba(124,58,237,.3);color:#C4B5FD;border-radius:4px;padding:1px 6px;\">방 = agent</span></span></div><div class=\"fline\" style=\"animation-delay:0.8999999999999999s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;\"><span class=\"mono\" style=\"font-size:13.5px;white-space:pre;color:rgba(110,231,183,.85);font-weight:600;\">    ├── 예상질문 스킬</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">이 이력서면 뭘 물어볼지 뽑는 방법<span style=\"margin-left:9px;font-size:9.5px;font-weight:800;background:rgba(16,185,129,.18);color:rgba(110,231,183,.9);border-radius:4px;padding:1px 6px;\">방법 = skill</span></span></div><div class=\"fline\" style=\"animation-delay:1.02s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;\"><span class=\"mono\" style=\"font-size:13.5px;white-space:pre;color:rgba(110,231,183,.85);font-weight:600;\">    └── 답변 다듬기 스킬</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">내 말투로 고치는 방법<span style=\"margin-left:9px;font-size:9.5px;font-weight:800;background:rgba(16,185,129,.18);color:rgba(110,231,183,.9);border-radius:4px;padding:1px 6px;\">방법 = skill</span></span></div></div>\n      <div class=\"cl pu\" style=\"margin-top:10px;margin-bottom:0;font-size:12px;\"><strong>방(agent)은 담당</strong>이고 <strong>스킬은 그 담당이 일하는 방법</strong>입니다. 담당 밑에 방법이 여러 개 붙습니다.</div>\n    </div>\n    <div>\n      <div class=\"card rd\"><div class=\"ctag rd\">한 방에 다 시키면</div><div class=\"cb\">JD 보다가 이력서 고치고 면접 질문까지 한 창에서 섞입니다. <strong>앞에서 정한 걸 뒤에서 잊습니다.</strong> 이력서 쓰던 논리로 면접 답변까지 만들어버립니다.</div></div>\n      <div class=\"card gr\" style=\"margin-top:10px;\"><div class=\"ctag gr\">나누면</div><div class=\"cb\">면접 방은 <strong>완성된 이력서만</strong> 받습니다. 왜 그렇게 썼는지는 모릅니다. 그래서 진짜 면접관처럼 봅니다.</div></div>\n      <div class=\"card am\" style=\"margin-top:10px;\"><div class=\"ctag am\">나누는 기준 한 줄</div><div class=\"cb\"><strong>섞이면 안 되는 판단이 두 개 이상일 때</strong>만 나눕니다. 하나면 그냥 한 방에서 하세요.</div></div>\n    </div>\n  </div>\n  \n</div>"},
{notes:"간지. 3초만 띄우고 넘어간다. 새로 쓰지 않습니다. 그때 대화한 창에서 끄집어냅니다.",html:"<div class=\"inner\" style=\"max-width:1000px;\">\n  <div style=\"display:flex;align-items:center;gap:26px;\">\n    <div style=\"font-size:92px;font-weight:900;line-height:1;color:rgba(124,58,237,.35);letter-spacing:-3px;\">01</div>\n    <div style=\"flex:1;\">\n      <div class=\"kicker\" style=\"margin-bottom:6px;\">준비 ① · 5–9분</div>\n      <div class=\"h2\" style=\"font-size:40px;line-height:1.25;\">지난주 이야기를 파일 한 장으로</div>\n      <div style=\"height:3px;width:74px;background:#7C3AED;border-radius:2px;margin:16px 0 14px;\"></div>\n      <div class=\"sub\" style=\"font-size:16px;\">새로 쓰지 않습니다. 그때 대화한 창에서 끄집어냅니다.</div>\n    </div>\n    <div class=\"agbox\" style=\"min-width:130px;text-align:center;animation-delay:.2s;\">\n      <div style=\"font-size:11px;color:rgba(255,255,255,.45);\">지금까지</div>\n      <div style=\"font-size:26px;font-weight:900;color:#fff;margin-top:4px;\">agent 0</div>\n    </div>\n  </div>\n</div>"},
{notes:"지난주에 이야기는 나눴는데 md로 안 만든 사람이 대부분이다. 그 대화가 채팅방에 그대로 남아 있다는 걸 알려주는 게 이 장표의 핵심. 지금 각자 그 창을 찾아 열게 하고, 못 찾은 사람 손을 들게 해서 대안으로 돌린다. 못 찾은 분에게는 말로만 안내한다 — 새 대화 열고 다음 장 여덟 항목을 직접 적어달라고 하면 3분이면 된다.",html:"<div class=\"inner\" style=\"max-width:1120px;\">\n  <div class=\"kicker\">준비 ① · 5–9분 · 4분</div>\n  <div class=\"h2\" style=\"font-size:25px;\">지난주에 나눈 이야기가 그대로 남아 있습니다</div>\n  <div class=\"sub\">새로 쓰지 않습니다. 그때 대화한 창을 찾아서, 거기서 끄집어냅니다.</div>\n  <div style=\"display:grid;grid-template-columns:1.2fr .9fr;gap:22px;align-items:start;margin-top:12px;\">\n    <div>\n      <div class=\"g2\">\n        <div class=\"card rd\"><div class=\"ctag rd\">지난주에 이렇게 하셨죠</div><div class=\"cb\">\n          내 업무 이야기를 한참 나눴고<br/>\n          문제를 한 문장으로 정리했고<br/>\n          md로 만들고 스킬로 만들라고 했는데<br/><br/>\n          <strong>거기까지는 아마 못 하셨을 겁니다.</strong></div></div>\n        <div class=\"card gr\"><div class=\"ctag gr\">그런데 괜찮습니다</div><div class=\"cb\">\n          <strong>나눈 이야기는 그 창에 다 남아 있습니다.</strong><br/><br/>\n          오늘은 그걸 긁어와서 한 장으로 묶기만 하면 됩니다. 5분이면 끝납니다.</div></div>\n      </div>\n      <div class=\"cl am\" style=\"margin-top:12px;\">지금 <strong>지난주에 대화했던 창</strong>을 찾아서 열어주세요. 찾으신 분 손 들어주세요.</div>\n      \n    </div>\n    <div class=\"demo card-pop\" style=\"animation-delay:.1s\">\n      <div class=\"dlbl\">지난주 창에 남아 있는 것</div>\n      <div class=\"bubble mono\" style=\"animation-delay:.5s;font-size:11.5px;\">제 업무는 매주 회의록을 정리해서…</div>\n      <div class=\"bubble mono\" style=\"animation-delay:1.0s;font-size:11.5px;\">그때 제일 신경 쓰는 건 결정된 것만…</div>\n      <div class=\"bubble mono\" style=\"animation-delay:1.5s;font-size:11.5px;\">담당자가 없으면 임의로 안 만들고…</div>\n      <div style=\"font-size:11.5px;color:rgba(255,255,255,.45);margin-top:10px;\">이게 전부 재료입니다.<br/>기억해낼 필요 없이 긁어오면 됩니다.</div>\n    </div>\n  </div>\n</div>"},
{notes:"복붙 프롬프트. 지난주 창에 그대로 붙여넣게 한다. 대괄호도 없어서 고칠 게 없다. 비워두라는 지시가 들어 있으니, 빈칸이 나와도 정상이라고 미리 말해준다.",html:"<div class=\"inner\" style=\"max-width:1080px;\">\n  <div class=\"kicker\">준비 ① · 복사해서 붙이기</div>\n  <div class=\"h2\" style=\"font-size:25px;\">그 창에 이 글을 그대로 붙여넣으세요</div>\n  <pre class=\"prompt\">이 대화창에서 내가 한 이야기를 전부 긁어모아 md 파일 한 장으로 정리해줘.\n이 파일은 내 업무 에이전트를 만들기 전에, 그 에이전트가 읽을 배경 자료로 쓸 거야.\n\n아래 순서로 적어줘.\n1. 내가 풀려는 문제 한 문장\n2. 내 직무와 하는 일\n3. 이 업무의 진행 순서 (내가 말했던 그대로)\n4. 내가 중요하다고 말한 판단 기준\n5. 하면 안 된다고 말한 것\n6. 사람이 확인해야 한다고 말한 지점\n7. 결과물이 어떤 모양이어야 한다고 말한 것\n8. 고치고 싶다고 말한 것\n\n내가 말한 것만 적어. 비어 있는 항목은 비어 둔 채로 두고 추측해서 채우지 마.\n파일 이름은 background.md 로 해줘.</pre>\n  <div class=\"cl gr\">고칠 데 없습니다. 통째로 복사해서 붙이고 엔터만 치면 됩니다.</div>\n</div>"},
{notes:"이 문서에 뭐가 들어 있는지 보여주는 장표. 여덟 줄을 다 읽지 말고 4번과 6번 노란 줄만 짚는다. 빈칸이 있는 게 정상이고, 그 빈칸을 다음 단계에서 AI가 하나씩 물어본다고 말하고 넘어간다.",html:"<div class=\"inner\" style=\"max-width:1120px;\">\n  <div class=\"kicker\">준비 ① · 이 문서 안에는</div>\n  <div class=\"h2\" style=\"font-size:25px;\">여덟 가지가 들어 있습니다. 비어 있어도 정상입니다</div>\n  <div class=\"demo\" style=\"margin-top:14px;padding:16px 20px;\">\n    <div class=\"dlbl\">background.md</div>\n    <div style=\"background:rgba(0,0,0,.24);border-radius:9px;padding:12px 16px;\"><div class=\"fline\" style=\"animation-delay:0.25s;display:grid;grid-template-columns:22px 218px 1fr;gap:8px;padding:3px 0;align-items:baseline;\"><span class=\"mono\" style=\"font-size:12px;color:rgba(255,255,255,.35);\">1</span><span style=\"font-size:12.5px;color:rgba(255,255,255,.8);font-weight:600;\">내가 풀려는 문제 한 문장</span><span style=\"font-size:12.5px;color:rgba(255,255,255,.62);\">회의록을 팀 공유용으로 정리하는 데 시간이 오래 걸린다</span></div><div class=\"fline\" style=\"animation-delay:0.33999999999999997s;display:grid;grid-template-columns:22px 218px 1fr;gap:8px;padding:3px 0;align-items:baseline;\"><span class=\"mono\" style=\"font-size:12px;color:rgba(255,255,255,.35);\">2</span><span style=\"font-size:12.5px;color:rgba(255,255,255,.8);font-weight:600;\">내 직무와 하는 일</span><span style=\"font-size:12.5px;color:rgba(255,255,255,.62);\">기획팀 · 주간회의 담당</span></div><div class=\"fline\" style=\"animation-delay:0.43s;display:grid;grid-template-columns:22px 218px 1fr;gap:8px;padding:3px 0;align-items:baseline;\"><span class=\"mono\" style=\"font-size:12px;color:rgba(255,255,255,.35);\">3</span><span style=\"font-size:12.5px;color:rgba(255,255,255,.8);font-weight:600;\">이 업무의 진행 순서</span><span style=\"font-size:12.5px;color:rgba(255,255,255,.62);\">원문 읽기 → 결정된 것만 추리기 → 담당자 → 기한</span></div><div class=\"fline\" style=\"animation-delay:0.52s;display:grid;grid-template-columns:22px 218px 1fr;gap:8px;padding:3px 0;align-items:baseline;\"><span class=\"mono\" style=\"font-size:12px;color:rgba(255,255,255,.35);\">4</span><span style=\"font-size:12.5px;color:rgba(255,255,255,.8);font-weight:600;\">내가 중요하다고 말한 판단 기준</span><span style=\"font-size:12.5px;color:rgba(252,211,77,.9);\">(비어 있음)</span></div><div class=\"fline\" style=\"animation-delay:0.61s;display:grid;grid-template-columns:22px 218px 1fr;gap:8px;padding:3px 0;align-items:baseline;\"><span class=\"mono\" style=\"font-size:12px;color:rgba(255,255,255,.35);\">5</span><span style=\"font-size:12.5px;color:rgba(255,255,255,.8);font-weight:600;\">하면 안 된다고 말한 것</span><span style=\"font-size:12.5px;color:rgba(255,255,255,.62);\">원문에 없는 내용 쓰지 않기</span></div><div class=\"fline\" style=\"animation-delay:0.7s;display:grid;grid-template-columns:22px 218px 1fr;gap:8px;padding:3px 0;align-items:baseline;\"><span class=\"mono\" style=\"font-size:12px;color:rgba(255,255,255,.35);\">6</span><span style=\"font-size:12.5px;color:rgba(255,255,255,.8);font-weight:600;\">사람이 확인해야 한다고 말한 지점</span><span style=\"font-size:12.5px;color:rgba(252,211,77,.9);\">(비어 있음)</span></div><div class=\"fline\" style=\"animation-delay:0.79s;display:grid;grid-template-columns:22px 218px 1fr;gap:8px;padding:3px 0;align-items:baseline;\"><span class=\"mono\" style=\"font-size:12px;color:rgba(255,255,255,.35);\">7</span><span style=\"font-size:12.5px;color:rgba(255,255,255,.8);font-weight:600;\">결과물이 어떤 모양이어야 하는지</span><span style=\"font-size:12.5px;color:rgba(255,255,255,.62);\">제목 / 결정사항 / 다음 할 일</span></div><div class=\"fline\" style=\"animation-delay:0.88s;display:grid;grid-template-columns:22px 218px 1fr;gap:8px;padding:3px 0;align-items:baseline;\"><span class=\"mono\" style=\"font-size:12px;color:rgba(255,255,255,.35);\">8</span><span style=\"font-size:12.5px;color:rgba(255,255,255,.8);font-weight:600;\">고치고 싶다고 말한 것</span><span style=\"font-size:12.5px;color:rgba(255,255,255,.62);\">매번 형식이 달라지는 것</span></div></div>\n  </div>\n  <div class=\"cl am\">노란 줄은 <strong>지난주에 그 얘기를 안 했다는 뜻</strong>일 뿐입니다. 다음 단계에서 AI가 하나씩 물어봅니다.</div>\n</div>"},
{notes:"확인 세 단계만. 3번이 제일 중요하다 — 전부 복사, 창 닫지 마세요. 다음은 다른 방이라 이 대화가 안 따라간다. 여기서 손 들게 하고 다음으로 넘어간다.",html:"<div class=\"inner\" style=\"max-width:900px;\">\n  <div class=\"kicker\">준비 ① · 확인</div>\n  <div class=\"h2\" style=\"font-size:25px;\">여기까지 하고 넘어갑니다</div>\n  <div style=\"margin-top:18px;\">\n    <div class=\"step\"><div class=\"sn\">1</div><div class=\"st\">나온 내용을 <strong>쭉 훑어보세요.</strong> 내가 한 말이 맞는지만 보면 됩니다.</div></div>\n    <div class=\"step\"><div class=\"sn\">2</div><div class=\"st\"><strong>비어 있는 항목은 그냥 두세요.</strong> 채우려고 붙잡지 마세요.</div></div>\n    <div class=\"step\"><div class=\"sn\">3</div><div class=\"st\">나온 내용을 <strong>전부 복사해두세요.</strong> 이 창은 닫지 마세요.</div></div>\n  </div>\n  <div class=\"cl pu\">다음은 <strong>다른 방</strong>에서 합니다. 그 방은 이 대화를 모릅니다.</div>\n</div>"},
{notes:"아키텍처 한 장. 아직 폴더가 없다는 걸 보여주는 게 목적이다. 재료만 손에 쥔 상태. 회색 줄이 앞으로 채울 자리라고 한 번 짚고 3초 만에 넘어간다.",html:"<div class=\"inner\" style=\"max-width:1120px;\">\n  <div class=\"kicker\">아키텍처 · 준비 ① 끝</div>\n  <div class=\"h2\" style=\"font-size:25px;\">아직 폴더는 없습니다. 재료 한 장이 생겼을 뿐</div>\n  <div class=\"demo\" style=\"margin-top:12px;padding:14px 18px;\">\n    <div class=\"dlbl\">방 — 일하는 쪽</div>\n    <div style=\"display:flex;gap:12px;align-items:stretch;\"><div class=\"agbox\" style=\"flex:1;animation-delay:0.1s;text-align:center;border-color:#7C3AED;background:rgba(124,58,237,.14);\"><div style=\"font-weight:800;font-size:13px;color:#fff;\">지난주 대화창</div><div style=\"font-size:11px;color:rgba(255,255,255,.55);margin-top:3px;\">파일은 못 만듭니다</div></div><div style=\"flex:1;border:1px dashed rgba(255,255,255,.16);border-radius:10px;padding:10px 12px;text-align:center;\"><div style=\"font-weight:800;font-size:13px;color:rgba(255,255,255,.22);\">1번 방</div><div style=\"font-size:11px;color:rgba(255,255,255,.18);margin-top:3px;\">준비 ②에서</div></div><div style=\"flex:1;border:1px dashed rgba(255,255,255,.16);border-radius:10px;padding:10px 12px;text-align:center;\"><div style=\"font-weight:800;font-size:13px;color:rgba(255,255,255,.22);\">2번 방</div><div style=\"font-size:11px;color:rgba(255,255,255,.18);margin-top:3px;\">멀티에이전트 만들기에서</div></div></div>\n    <div style=\"text-align:center;margin-top:10px;\"><div class=\"fline\" style=\"animation-delay:.3s;display:inline-block;padding:7px 14px;border-radius:9px;border:1px solid #7C3AED;background:rgba(124,58,237,.14);\"><span class=\"mono\" style=\"font-size:13px;font-weight:700;color:#C4B5FD;\">background.md</span><span style=\"font-size:11.5px;color:rgba(255,255,255,.5);margin-left:10px;\">아직 대화창 안에 있습니다</span></div></div>\n    <div style=\"text-align:center;font-size:12px;color:#A78BFA;margin:10px 0 8px;\">↓&nbsp;&nbsp;폴더는 아직 없습니다. 다음 실습에서 만듭니다&nbsp;&nbsp;↓</div>\n    <div class=\"dlbl\">폴더 — 둘이 같이 쓰는 책상</div>\n    <div style=\"background:rgba(0,0,0,.26);border-radius:9px;padding:11px 14px;\"><div class=\"fline\" style=\"animation-delay:0.5s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:rgba(255,255,255,.20);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">내_업무_폴더/</span><span style=\"font-size:12px;color:rgba(255,255,255,.20);\"></span></div><div class=\"fline\" style=\"animation-delay:0.5700000000000001s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:rgba(255,255,255,.20);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">├── CLAUDE.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.20);\">이 방의 규칙. 모든 대화가 먼저 읽습니다</span></div><div class=\"fline\" style=\"animation-delay:0.64s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:rgba(255,255,255,.20);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">├── 01_input/</span><span style=\"font-size:12px;color:rgba(255,255,255,.20);\">이번에 처리할 원본 자료</span></div><div class=\"fline\" style=\"animation-delay:0.71s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:rgba(255,255,255,.20);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">├── 02_reference/</span><span style=\"font-size:12px;color:rgba(255,255,255,.20);\">계속 참고할 기준과 예시</span></div><div class=\"fline\" style=\"animation-delay:0.78s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:rgba(255,255,255,.20);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">│   └── background.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.20);\">내 업무 배경 — 지난주 대화에서 옮겨온 것</span></div><div class=\"fline\" style=\"animation-delay:0.8500000000000001s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:rgba(255,255,255,.20);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">├── 03_skills/</span><span style=\"font-size:12px;color:rgba(255,255,255,.20);\">일하는 순서</span></div><div class=\"fline\" style=\"animation-delay:0.92s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:rgba(255,255,255,.20);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">│   └── SKILL.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.20);\">다섯 칸짜리 내 업무 순서</span></div><div class=\"fline\" style=\"animation-delay:0.99s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:rgba(255,255,255,.20);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">└── 04_output/</span><span style=\"font-size:12px;color:rgba(255,255,255,.20);\">완성된 결과물</span></div><div class=\"fline\" style=\"animation-delay:1.06s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:rgba(255,255,255,.20);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">    ├── draft.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.20);\">1번 방이 낸 초안</span></div><div class=\"fline\" style=\"animation-delay:1.1300000000000001s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:rgba(255,255,255,.20);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">    └── review.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.20);\">2번 방이 낸 지적 목록</span></div></div>\n  </div>\n</div>"},
{notes:"간지. 3초만 띄우고 넘어간다. 방을 옮깁니다. 파일이 진짜로 만들어지는 방으로.",html:"<div class=\"inner\" style=\"max-width:1000px;\">\n  <div style=\"display:flex;align-items:center;gap:26px;\">\n    <div style=\"font-size:92px;font-weight:900;line-height:1;color:rgba(124,58,237,.35);letter-spacing:-3px;\">02</div>\n    <div style=\"flex:1;\">\n      <div class=\"kicker\" style=\"margin-bottom:6px;\">준비 ② · 9–16분</div>\n      <div class=\"h2\" style=\"font-size:40px;line-height:1.25;\">agent 하나의 자리를 만듭니다</div>\n      <div style=\"height:3px;width:74px;background:#7C3AED;border-radius:2px;margin:16px 0 14px;\"></div>\n      <div class=\"sub\" style=\"font-size:16px;\">방을 옮깁니다. 파일이 진짜로 만들어지는 방으로.</div>\n    </div>\n    <div class=\"agbox\" style=\"min-width:130px;text-align:center;animation-delay:.2s;\">\n      <div style=\"font-size:11px;color:rgba(255,255,255,.45);\">지금까지</div>\n      <div style=\"font-size:26px;font-weight:900;color:#fff;margin-top:4px;\">agent 0 → 1</div>\n    </div>\n  </div>\n</div>"},
{notes:"여기가 \"방 이동\" 개념을 처음 제대로 말하는 자리다. 지난주 방 ≠ 오늘 방. 새 방은 지난주 대화를 못 본다. 그래서 프롬프트에 배경을 통째로 붙여 넣어 옮긴다 — 이걸 \"이전 프롬프트\"라고 부른다고 한 번 말해준다. Accept edits 꼭 챙긴다. 프로젝트는 지난주에 이미 만드셨으니 새로 만들 필요 없다고 짚어준다.",html:"<div class=\"inner\">\n  <div class=\"kicker\">준비 ② · 9–16분 · 7분</div>\n  <div class=\"h2\">첫 번째 agent의 자리를 만듭니다</div>\n  <div class=\"sub\">지금까지는 그냥 대화창이었습니다. 이제 <strong>방을 옮깁니다.</strong> 파일을 진짜로 만드는 방으로.</div>\n\n  <div class=\"demo\" style=\"margin-top:12px;padding:12px 14px;\">\n    <div style=\"display:grid;grid-template-columns:1fr 46px 1fr;gap:10px;align-items:center;\">\n      <div class=\"agbox\" style=\"animation-delay:.1s\">\n        <div style=\"font-size:11px;color:rgba(255,255,255,.45);\">지난주 방</div>\n        <div style=\"font-weight:700;font-size:14px;margin-top:2px;\">대화만 하는 창</div>\n        <div style=\"font-size:11.5px;color:rgba(255,255,255,.55);margin-top:4px;\">여기에 background.md 내용이 있음</div>\n      </div>\n      <div style=\"text-align:center;font-size:22px;color:#7C3AED;font-weight:700;\">→</div>\n      <div class=\"agbox\" style=\"animation-delay:.5s\">\n        <div style=\"font-size:11px;color:rgba(255,255,255,.45);\">오늘 새 방</div>\n        <div style=\"font-weight:700;font-size:14px;margin-top:2px;\">Code 탭 세션</div>\n        <div style=\"font-size:11.5px;color:rgba(252,211,77,.9);margin-top:4px;\">여긴 아무것도 모름 — 비어 있음</div>\n      </div>\n    </div>\n    <div class=\"cl am\" style=\"margin-top:10px;margin-bottom:0;\"><strong>방이 바뀌면 기억은 따라오지 않습니다.</strong> 그래서 짐을 들고 옮겨야 합니다. 그 짐이 아까 복사한 background.md입니다.</div>\n  </div>\n\n  <div style=\"margin-top:12px;\">\n    <div class=\"step\"><div class=\"sn\">1</div><div class=\"st\">바탕화면에 폴더를 하나 만들고 <strong>내 업무 이름</strong>을 붙입니다.</div></div>\n    <div class=\"step\"><div class=\"sn\">2</div><div class=\"st\">Claude 앱 <strong>Code 탭</strong>에서 새 세션. 환경은 Local, 폴더는 방금 만든 그 폴더.</div></div>\n    <div class=\"step\"><div class=\"sn\">3</div><div class=\"st\">권한 모드를 <strong>Accept edits</strong>로 둡니다. 매번 허락 버튼을 누르면 시간이 다 갑니다.</div></div>\n    <div class=\"step\"><div class=\"sn\">4</div><div class=\"st\">다음 <strong>두 장을 순서대로</strong> 붙입니다. ① 서랍 짜기 → ② 배경 옮기기.</div></div>\n  </div>\n</div>"},
{notes:"1단계 — 서랍부터 짠다. 붙여넣고 엔터만 치면 된다. 여기서 왼쪽 파일 목록에 폴더 네 개가 하나씩 생기는 걸 말 없이 보게 둔다. Finder도 같이 띄워놓고 '진짜 내 컴퓨터에 생겼다'를 한 번 보여주면 체감이 크다. 대괄호는 CLAUDE.md 쪽 네 줄뿐이다.",html:"<div class=\"inner\" style=\"max-width:1150px;\">\n  <div class=\"kicker\">준비 ② · 1단계 · 폴더 정리</div>\n  <div class=\"h2\" style=\"font-size:25px;\">먼저 방 안에 서랍을 짭니다</div>\n  <div style=\"display:grid;grid-template-columns:1.25fr .75fr;gap:18px;align-items:start;margin-top:10px;\">\n    <div>\n      <pre class=\"prompt\" style=\"font-size:12.5px;\">내 업무용 작업 폴더를 정리하려고 해. 나는 [ 내 직무 / 하는 일 ]이야.\n\n1. 이 폴더 안에 네 칸을 만들어줘.\n   01_input      이번에 처리할 원본 자료\n   02_reference  계속 참고할 기준과 예시\n   03_skills     일하는 순서\n   04_output     완성된 결과물\n\n2. CLAUDE.md 파일을 만들고 아래를 적어줘.\n   - 내가 풀려는 문제 한 줄 [ 지난주 쓴 문장, 없으면 지금 한 줄 ]\n   - 결과물 말투     [ 예: 입니다체, 짧은 문장, 과장 없이 ]\n   - 항상 지킬 형식   [ 예: 제목 / 핵심 3줄 / 다음 할 일 ]\n   - 절대 하면 안 될 것 [ 예: 확인 안 된 숫자 쓰기, 승인 없이 메일 보내기 ]\n\n3. 다 만들었으면 폴더 구조를 보여줘.</pre>\n    </div>\n    <div class=\"demo card-pop\" style=\"animation-delay:.1s\">\n      <div class=\"dlbl\">내 컴퓨터에 이렇게 생깁니다</div>\n      <div class=\"mono\" style=\"font-size:12px;line-height:1.95;\">\n        <div class=\"fline\" style=\"animation-delay:.3s;color:rgba(255,255,255,.75);font-weight:700;\"><i style=\"background:#334155\"></i>회의록작업/</div>\n        <div class=\"fline fn\" style=\"animation-delay:.8s;\">&nbsp;&nbsp;<i></i>CLAUDE.md</div>\n        <div class=\"fline fn\" style=\"animation-delay:1.1s;\">&nbsp;&nbsp;<i></i>01_input/</div>\n        <div class=\"fline fn\" style=\"animation-delay:1.4s;\">&nbsp;&nbsp;<i></i>02_reference/</div>\n        <div class=\"fline fn\" style=\"animation-delay:1.7s;\">&nbsp;&nbsp;<i></i>03_skills/</div>\n        <div class=\"fline fn\" style=\"animation-delay:2.0s;\">&nbsp;&nbsp;<i></i>04_output/</div>\n      </div>\n      <div class=\"bubble\" style=\"animation-delay:2.6s;margin-top:10px;margin-bottom:0;font-size:12px;\">Finder를 열어보세요. <strong>진짜로 생겨 있습니다.</strong></div>\n    </div>\n  </div>\n  <div class=\"cl gr\">고칠 곳은 <strong>대괄호 다섯 개</strong>뿐입니다. 아직 배경은 안 넣습니다. 서랍만 짜는 단계입니다.</div>\n</div>"},
{notes:"2단계 — 이제 배경을 옮긴다. 이 방은 지난주 대화를 못 본다는 걸 다시 한 번 말하고, 구분선 사이에 붙여넣으라고 화면에서 손으로 짚어준다. 02_reference/background.md가 왼쪽 목록에 뜨면 성공. 여기까지가 준비 끝이다.",html:"<div class=\"inner\" style=\"max-width:1150px;\">\n  <div class=\"kicker\">준비 ② · 2단계 · 지난 대화 옮기기</div>\n  <div class=\"h2\" style=\"font-size:25px;\">서랍이 생겼으니 배경을 넣습니다</div>\n  <div class=\"cl am\" style=\"margin-top:8px;\">이 방은 <strong>지난주 대화를 한 줄도 못 봅니다.</strong> 그래서 복사해서 통째로 옮깁니다. 이걸 <strong>이전 프롬프트</strong>라고 부릅니다.</div>\n  <div style=\"display:grid;grid-template-columns:1.25fr .75fr;gap:18px;align-items:start;margin-top:8px;\">\n    <div>\n      <pre class=\"prompt\" style=\"font-size:12.5px;\">아래는 내가 다른 대화창에서 정리해 둔 내 업무 배경이야.\n이 방은 그 대화를 모르니까 그대로 옮겨왔어.\n\n--- 여기부터 배경 ---\n[ 아까 복사한 내용 전체를 여기에 붙여넣기 ]\n--- 여기까지 배경 ---\n\n1. 위 배경을 <b>02_reference/background.md</b> 로 그대로 저장해줘.\n   내용은 고치지 마. 비어 있는 항목도 비운 채로 둬.\n\n2. 이 배경과 CLAUDE.md를 비교해서, 서로 어긋나는 게 있으면\n   고치지 말고 <b>어디가 다른지만</b> 알려줘.</pre>\n    </div>\n    <div class=\"demo card-pop\" style=\"animation-delay:.1s\">\n      <div class=\"dlbl\">이게 뜨면 준비 끝</div>\n      <div class=\"mono\" style=\"font-size:12px;line-height:1.95;\">\n        <div class=\"fline\" style=\"animation-delay:.3s;color:rgba(255,255,255,.4);\"><i style=\"background:#334155\"></i>회의록작업/</div>\n        <div class=\"fline\" style=\"animation-delay:.5s;color:rgba(255,255,255,.4);\">&nbsp;&nbsp;<i style=\"background:#334155\"></i>CLAUDE.md</div>\n        <div class=\"fline\" style=\"animation-delay:.7s;color:rgba(255,255,255,.4);\">&nbsp;&nbsp;<i style=\"background:#334155\"></i>02_reference/</div>\n        <div class=\"fline fn\" style=\"animation-delay:1.3s;font-weight:700;\">&nbsp;&nbsp;&nbsp;&nbsp;<i></i>background.md</div>\n      </div>\n      <div class=\"bubble\" style=\"animation-delay:1.9s;margin-top:10px;margin-bottom:0;font-size:12px;\">대화창에 있던 게 <strong>파일이 됐습니다.</strong> 이제 다른 방에서도 읽힙니다.</div>\n    </div>\n  </div>\n  \n</div>"},
{notes:"두 번째 확인이 이 블록의 진짜 목표다. 파일을 열어서 지난주 문장을 손으로 가리키게 한다. 먼저 끝난 사람에게는 금지선 한 줄 더 쓰게 시킨다.",html:"<div class=\"inner\">\n  <div class=\"kicker\">준비 ② · 확인</div>\n  <div class=\"h2\">두 가지만 확인하고 넘어갑니다</div>\n  <div class=\"g2\" style=\"margin-top:16px;\">\n    <div class=\"card gr\"><div class=\"ctag gr\">01</div><div class=\"ct\">왼쪽에 보이나요</div><div class=\"cb\">앱 왼쪽 파일 목록에 <strong>폴더 네 개와 CLAUDE.md</strong>가 실제로 보이면 성공입니다. 안 보이면 손 드세요.</div></div>\n    <div class=\"card pu\"><div class=\"ctag pu\">02</div><div class=\"ct\">첫 줄에 내 문장이 있나요</div><div class=\"cb\">CLAUDE.md를 열어보세요. 첫 줄에 <strong>내가 쓴 문장</strong>이 그대로 들어가 있습니다. 손으로 한번 가리켜보세요.</div></div>\n  </div>\n  <div class=\"cl gr\">먼저 끝난 분은 CLAUDE.md를 열어서 <strong>하면 안 되는 것</strong>을 한 줄 더 써보세요.</div>\n</div>"},
{notes:"폴더가 통째로 생겼다. 노란 NEW만 짚는다. 03_skills는 아직 비어 있다는 걸 손으로 가리키고 넘어간다.",html:"<div class=\"inner\" style=\"max-width:1120px;\">\n  <div class=\"kicker\">아키텍처 · 준비 ② 끝</div>\n  <div class=\"h2\" style=\"font-size:25px;\">책상이 생겼고, 배경이 그 안으로 들어왔습니다</div>\n  <div class=\"demo\" style=\"margin-top:12px;padding:14px 18px;\">\n    <div class=\"dlbl\">방 — 일하는 쪽</div>\n    <div style=\"display:flex;gap:12px;align-items:stretch;\"><div class=\"agbox\" style=\"flex:1;animation-delay:0.1s;text-align:center;border-color:#7C3AED;background:rgba(124,58,237,.14);\"><div style=\"font-weight:800;font-size:13px;color:#fff;\">1번 방</div><div style=\"font-size:11px;color:rgba(255,255,255,.55);margin-top:3px;\">Code 탭 · 파일을 만듭니다</div></div><div style=\"flex:1;border:1px dashed rgba(255,255,255,.16);border-radius:10px;padding:10px 12px;text-align:center;\"><div style=\"font-weight:800;font-size:13px;color:rgba(255,255,255,.22);\">2번 방</div><div style=\"font-size:11px;color:rgba(255,255,255,.18);margin-top:3px;\">멀티에이전트 만들기에서</div></div></div>\n    \n    <div style=\"text-align:center;font-size:12px;color:#A78BFA;margin:10px 0 8px;\">↓&nbsp;&nbsp;1번 방이 이 폴더를 봅니다&nbsp;&nbsp;↓</div>\n    <div class=\"dlbl\">폴더 — 둘이 같이 쓰는 책상</div>\n    <div style=\"background:rgba(0,0,0,.26);border-radius:9px;padding:11px 14px;\"><div class=\"fline\" style=\"animation-delay:0.5s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:#C4B5FD;font-weight:700;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">내_업무_폴더/</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\"><span style=\"margin-left:8px;font-size:9.5px;font-weight:800;letter-spacing:.5px;background:#7C3AED;color:#fff;border-radius:4px;padding:1px 5px;vertical-align:1px;\">NEW</span></span></div><div class=\"fline\" style=\"animation-delay:0.5700000000000001s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:#C4B5FD;font-weight:700;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">├── CLAUDE.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">이 방의 규칙. 모든 대화가 먼저 읽습니다<span style=\"margin-left:8px;font-size:9.5px;font-weight:800;letter-spacing:.5px;background:#7C3AED;color:#fff;border-radius:4px;padding:1px 5px;vertical-align:1px;\">NEW</span></span></div><div class=\"fline\" style=\"animation-delay:0.64s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:#C4B5FD;font-weight:700;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">├── 01_input/</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">이번에 처리할 원본 자료<span style=\"margin-left:8px;font-size:9.5px;font-weight:800;letter-spacing:.5px;background:#7C3AED;color:#fff;border-radius:4px;padding:1px 5px;vertical-align:1px;\">NEW</span></span></div><div class=\"fline\" style=\"animation-delay:0.71s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:#C4B5FD;font-weight:700;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">├── 02_reference/</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">계속 참고할 기준과 예시<span style=\"margin-left:8px;font-size:9.5px;font-weight:800;letter-spacing:.5px;background:#7C3AED;color:#fff;border-radius:4px;padding:1px 5px;vertical-align:1px;\">NEW</span></span></div><div class=\"fline\" style=\"animation-delay:0.78s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:#C4B5FD;font-weight:700;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">│   └── background.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">내 업무 배경 — 지난주 대화에서 옮겨온 것<span style=\"margin-left:8px;font-size:9.5px;font-weight:800;letter-spacing:.5px;background:#7C3AED;color:#fff;border-radius:4px;padding:1px 5px;vertical-align:1px;\">NEW</span></span></div><div class=\"fline\" style=\"animation-delay:0.8500000000000001s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:#C4B5FD;font-weight:700;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">├── 03_skills/</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">일하는 순서<span style=\"margin-left:8px;font-size:9.5px;font-weight:800;letter-spacing:.5px;background:#7C3AED;color:#fff;border-radius:4px;padding:1px 5px;vertical-align:1px;\">NEW</span></span></div><div class=\"fline\" style=\"animation-delay:0.92s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:rgba(255,255,255,.20);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">│   └── SKILL.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.20);\">다섯 칸짜리 내 업무 순서</span></div><div class=\"fline\" style=\"animation-delay:0.99s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:#C4B5FD;font-weight:700;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">└── 04_output/</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">완성된 결과물<span style=\"margin-left:8px;font-size:9.5px;font-weight:800;letter-spacing:.5px;background:#7C3AED;color:#fff;border-radius:4px;padding:1px 5px;vertical-align:1px;\">NEW</span></span></div><div class=\"fline\" style=\"animation-delay:1.06s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:rgba(255,255,255,.20);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">    ├── draft.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.20);\">1번 방이 낸 초안</span></div><div class=\"fline\" style=\"animation-delay:1.1300000000000001s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:rgba(255,255,255,.20);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">    └── review.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.20);\">2번 방이 낸 지적 목록</span></div></div>\n  </div>\n</div>"},
{notes:"오늘 60분이 지나가는 네 단계. 각 단계에서 무엇이 무엇으로 바뀌는지만 짚는다. 말이 굳어지고 → 파일이 되고 → 자동으로 꺼내지고 → 사람이 된다. 여기서 스킬과 에이전트의 차이를 한 문장으로 못박는다.",html:"<div class=\"inner\" style=\"max-width:1080px;\">\n  <div class=\"kicker\">오늘 지나가는 네 단계</div>\n  <div class=\"h2\" style=\"font-size:25px;\">말에서 시작해서 사람이 됩니다</div>\n  <div class=\"flow\" style=\"margin-top:16px;display:flex;\">\n    <div class=\"fnode\" style=\"min-width:150px;\"><div class=\"ct\" style=\"font-size:14px;\">① 이야기</div><div class=\"cb\" style=\"font-size:11.5px;margin-top:5px;\">채팅으로 배경을<br/>말로 풀어놓기</div></div>\n    <div class=\"farr\">→</div>\n    <div class=\"fnode\" style=\"min-width:150px;\"><div class=\"ct\" style=\"font-size:14px;\">② 파일</div><div class=\"cb\" style=\"font-size:11.5px;margin-top:5px;\">그걸 md 한 장으로<br/>묶어서 남기기</div></div>\n    <div class=\"farr\">→</div>\n    <div class=\"fnode\" style=\"min-width:150px;border-color:rgba(124,58,237,.5);background:rgba(124,58,237,.12);\"><div class=\"ct\" style=\"font-size:14px;\">③ 스킬</div><div class=\"cb\" style=\"font-size:11.5px;margin-top:5px;\">일하는 순서로 바꿔서<br/>알아서 꺼내 쓰게</div></div>\n    <div class=\"farr\">→</div>\n    <div class=\"fnode\" style=\"min-width:150px;border-color:rgba(124,58,237,.5);background:rgba(124,58,237,.12);\"><div class=\"ct\" style=\"font-size:14px;\">④ 에이전트</div><div class=\"cb\" style=\"font-size:11.5px;margin-top:5px;\">그 순서를 든<br/>담당자로 만들기</div></div>\n  </div>\n  <table class=\"tbl\" style=\"margin-top:14px;\">\n    <thead><tr><th style=\"width:100px\">단계</th><th style=\"width:260px\">뭐가 달라지나</th><th>안 하면 생기는 일</th></tr></thead>\n    <tbody>\n      <tr><td>① → ②</td><td>말이 <strong>사라지지 않게</strong> 굳음</td><td>창을 닫으면 같이 사라진다</td></tr>\n      <tr><td>② → ③</td><td>내가 안 시켜도 <strong>알아서 꺼내 씀</strong></td><td>매번 그 파일 읽으라고 시켜야 한다</td></tr>\n      <tr class=\"focal\"><td class=\"done\">③ → ④</td><td class=\"done\">순서에 <strong>주인과 권한</strong>이 생김</td><td class=\"warn\">한 명이 다 해서 자기가 쓴 걸 자기가 통과시킨다</td></tr>\n    </tbody>\n  </table>\n  <div class=\"bigmsg\"><div class=\"bmlbl\">한 문장으로</div><div class=\"bmtxt\">순서를 적어두는 게 <span class=\"hl\">스킬</span>이고,<br/>그 순서대로 일하는 사람을 만드는 게 <span class=\"hl\">에이전트</span>입니다.</div></div>\n</div>"},
{notes:"이미 적혀 있는 것과 머릿속에만 있는 것. 어려운 단어를 쓰지 않고 설명한다. 오늘 꺼낼 건 후자라고 못박는다.",html:"<div class=\"inner\">\n  <div class=\"kicker\">두 번째 이야기</div>\n  <div class=\"h2\">AI가 못 하는 건 능력이 없어서가 아니라<br/>내 기준을 모르기 때문입니다</div>\n  <div class=\"g2\" style=\"margin-top:16px;\">\n    <div class=\"card sl\"><div class=\"ctag sl\">이미 적혀 있는 것</div><div class=\"ct\">매뉴얼 · 규정 · 양식</div><div class=\"cb\">글로 이미 있으니 그대로 주면 됩니다. 결재 규정, 보고서 양식 같은 것들입니다.</div></div>\n    <div class=\"card pu\"><div class=\"ctag pu\">내 머릿속에만 있는 것</div><div class=\"ct\">경험으로 쌓인 판단</div><div class=\"cb\">어디에도 안 적혀 있습니다. 이 기사는 넣고 저 기사는 빼는 이유, 이 표현이 더 낫다고 느끼는 이유. <strong>오늘 꺼낼 건 이쪽입니다.</strong></div></div>\n  </div>\n  <div class=\"bigmsg\"><div class=\"bmlbl\">쉽게 말하면</div><div class=\"bmtxt\">오래 같은 일을 해서 생긴 <span class=\"hl\">설명하긴 어려운데 나는 아는 것</span>을<br/>글로 한 번 적어보는 겁니다.</div></div>\n</div>"},
{notes:"실제 사례. 매일 아침 뉴스 50건을 10건으로 줄이던 분. 머릿속 기준이 글이 되는 순간을 보여준다.",html:"<div class=\"inner\">\n  <div class=\"kicker\">실제 사례 A</div>\n  <div class=\"h2\">머릿속 기준을 적었더니 그대로 쓸 수 있게 됐습니다</div>\n  <div class=\"sub\">홍보 담당자 · 매일 아침 뉴스 50건을 읽고 10건을 골라 한 문장씩 요약해 110명에게 메일 보내던 일</div>\n  <div class=\"g2\" style=\"margin-top:12px;\">\n    <div class=\"card am\"><div class=\"ctag am\">왜 필요했나</div><div class=\"cb\">고르는 기준과 문장 쓰는 습관이 본인 머릿속에만 있었습니다. 빠뜨리면 왜 빠졌냐는 말을 듣는 자리였고, 본인이 자리를 비우면 아무도 대신 못 했습니다.</div></div>\n    <div class=\"card gr\"><div class=\"ctag gr\">적어보니 이렇게 나왔습니다</div><div class=\"cb\"><strong>고를 때</strong> 우리 기관이 나오면 무조건 넣는다 / 예산·제도 얘기는 되도록 넣는다 / 같은 사안이 세 번째 나오면 뺀다<br/><strong>쓸 때</strong> 한 기사에 딱 한 문장 / 매체 이름 위치를 돌려가며 쓴다 / 문장 끝을 계속 바꾼다</div></div>\n  </div>\n  <div class=\"cl pu\">매일 머릿속에서 자동으로 돌아가던 기준이, <strong>글로 쓰고 나니 그대로 AI에게 줄 수 있는 지시문</strong>이 됐습니다.</div>\n</div>"},
{notes:"간지. 3초만 띄우고 넘어간다. 순서를 쥐여주고, 실제로 한 번 돌립니다. 여기서 에이전트가 완성됩니다.",html:"<div class=\"inner\" style=\"max-width:1000px;\">\n  <div style=\"display:flex;align-items:center;gap:26px;\">\n    <div style=\"font-size:92px;font-weight:900;line-height:1;color:rgba(124,58,237,.35);letter-spacing:-3px;\">03</div>\n    <div style=\"flex:1;\">\n      <div class=\"kicker\" style=\"margin-bottom:6px;\">오늘 ① · 16–36분</div>\n      <div class=\"h2\" style=\"font-size:40px;line-height:1.25;\">에이전트를 만듭니다</div>\n      <div style=\"height:3px;width:74px;background:#7C3AED;border-radius:2px;margin:16px 0 14px;\"></div>\n      <div class=\"sub\" style=\"font-size:16px;\">순서를 쥐여주고, 실제로 한 번 돌립니다. 여기서 에이전트가 완성됩니다.</div>\n    </div>\n    <div class=\"agbox\" style=\"min-width:130px;text-align:center;animation-delay:.2s;\">\n      <div style=\"font-size:11px;color:rgba(255,255,255,.45);\">지금까지</div>\n      <div style=\"font-size:26px;font-weight:900;color:#fff;margin-top:4px;\">agent 1</div>\n    </div>\n  </div>\n</div>"},
{notes:"에이전트가 챗봇과 뭐가 다른지 한 장으로 끝낸다. 핵심은 '답하고 끝'이 아니라 '계획-실행-검토-수정을 스스로 돈다'는 것. 그래서 만들 때 중요한 게 무엇을 만들지보다 무엇을 기준으로 다시 확인할지라는 문장을 꼭 읽어준다. 이 문장이 뒤의 검수 방과 이어진다.",html:"<div class=\"inner\" style=\"max-width:1100px;\">\n  <div class=\"kicker\">에이전트가 뭐냐면</div>\n  <div class=\"h2\" style=\"font-size:25px;\">답하고 끝나면 챗봇, 스스로 다시 확인하면 에이전트</div>\n  <div class=\"ba\" style=\"margin-top:14px;\">\n    <div class=\"bef\"><div class=\"balbl b\">챗봇</div><div class=\"batask\">질문 하나 → 답 하나 → 끝</div><div class=\"babody\">맞는지 틀렸는지는 사람이 봅니다. 다음에 또 물어보면 처음부터 다시 설명해야 합니다.</div></div>\n    <div class=\"aft\"><div class=\"balbl a\">에이전트</div><div class=\"batask\">목표 하나 → 스스로 돕니다</div><div class=\"babody\">계획을 세우고, 파일을 읽고 쓰고, 결과를 자기가 점검하고, 안 되면 다시 합니다.</div></div>\n  </div>\n  <div class=\"demo\" style=\"margin-top:14px;padding:14px 16px;\">\n    <div class=\"dlbl\">에이전트가 도는 네 단계</div>\n    <div style=\"display:grid;grid-template-columns:1fr 24px 1fr 24px 1fr 24px 1fr;gap:6px;align-items:center;\">\n      <div class=\"agbox\" style=\"text-align:center;animation-delay:.1s\"><div style=\"font-weight:800;font-size:13px;color:#fff;\">① 맥락 모으기</div><div style=\"font-size:11px;color:rgba(255,255,255,.5);margin-top:3px;\">폴더와 규칙부터 읽습니다</div></div>\n      <div style=\"text-align:center;color:rgba(255,255,255,.3);\">→</div>\n      <div class=\"agbox\" style=\"text-align:center;animation-delay:.35s\"><div style=\"font-weight:800;font-size:13px;color:#fff;\">② 행동</div><div style=\"font-size:11px;color:rgba(255,255,255,.5);margin-top:3px;\">파일을 쓰고 명령을 실행</div></div>\n      <div style=\"text-align:center;color:rgba(255,255,255,.3);\">→</div>\n      <div class=\"agbox\" style=\"text-align:center;animation-delay:.6s\"><div style=\"font-weight:800;font-size:13px;color:#fff;\">③ 결과 확인</div><div style=\"font-size:11px;color:rgba(255,255,255,.5);margin-top:3px;\">원하는 게 나왔는지 스스로 점검</div></div>\n      <div style=\"text-align:center;color:rgba(255,255,255,.3);\">↻</div>\n      <div class=\"agbox\" style=\"text-align:center;animation-delay:.85s\"><div style=\"font-weight:800;font-size:13px;color:#fff;\">④ 반복</div><div style=\"font-size:11px;color:rgba(255,255,255,.5);margin-top:3px;\">끝났거나 사람 확인이 필요할 때 멈춤</div></div>\n    </div>\n  </div>\n  <div class=\"bigmsg\"><div class=\"bmlbl\">그래서 만들 때 중요한 건</div><div class=\"bmtxt\">무엇을 만들지보다 <span class=\"hl\">무엇을 기준으로 다시 확인할지</span>입니다.<br/>③번이 없으면 에이전트가 아니라 그냥 자동 완성입니다.</div></div>\n</div>"},
{notes:"일하는 순서는 다섯 칸이면 끝난다. 특히 3번이 제일 중요하다고 짚는다. 여기가 비면 일반론이 나온다.",html:"<div class=\"inner\"><div class=\"kicker\">에이전트 만들기 · 16–36분 · 20분</div>\n  <div class=\"h2\">첫 agent에게 일하는 순서를 쥐여줍니다</div>\n  <div style=\"display:grid;grid-template-columns:1.25fr .85fr;gap:22px;align-items:start;margin-top:12px;\"><div><table class=\"tbl\" style=\"margin-top:10px;\">\n    <thead><tr><th style=\"width:130px\">칸</th><th>여기에 뭘 적나</th><th style=\"width:270px\">비어 있으면 이렇게 됩니다</th></tr></thead>\n    <tbody>\n      <tr><td>1. 이름</td><td>이 일을 한 줄로 부르는 이름</td><td>이름이 안 나오면 일이 아직 너무 큽니다</td></tr>\n      <tr><td>2. 넣는 것</td><td>시작에 필요한 자료 + 이 일을 왜 하는지</td><td>자료만 주면 뻔한 말이 나옵니다</td></tr>\n      <tr class=\"focal\"><td class=\"done\">3. 순서</td><td class=\"done\">내가 실제로 밟는 단계와 판단 기준</td><td class=\"warn\">일반론이 나옵니다. 여기가 제일 중요합니다</td></tr>\n      <tr><td>4. 나오는 것</td><td>결과물 모양을 예시까지</td><td>매번 다른 모양이 나옵니다</td></tr>\n      <tr><td>5. 내가 볼 곳</td><td>내가 마지막에 확인할 지점</td><td>확인 없이 그냥 나갑니다</td></tr>\n    </tbody>\n  </table>\n  <div class=\"bigmsg\"><div class=\"bmlbl\">여기서 중요한 것</div><div class=\"bmtxt\">이 다섯 칸을 <span class=\"hl\">여러분이 채우지 않습니다.</span><br/>아까 만든 background.md를 보고 AI가 먼저 다 씁니다.</div></div>\n</div><div><div class=\"demo card-pop\" style=\"animation-delay:.1s\">\n  <div class=\"dlbl\">AI가 이렇게 채웁니다</div>\n  <div class=\"slotrow\"><b>1. 이름</b><div class=\"slotval\"><span class=\"ph mono\" style=\"animation-delay:.6s\">…</span><span class=\"rv mono\" style=\"animation-delay:.7s\">회의록 정리</span></div></div>\n  <div class=\"slotrow\"><b>2. 넣는 것</b><div class=\"slotval\"><span class=\"ph mono\" style=\"animation-delay:1.0s\">…</span><span class=\"rv mono\" style=\"animation-delay:1.1s\">회의 원문 + 참석자</span></div></div>\n  <div class=\"slotrow\"><b>3. 순서</b><div class=\"slotval\"><span class=\"ph mono\" style=\"animation-delay:1.4s\">…</span><span class=\"rv mono\" style=\"animation-delay:1.5s\">결정된 것만 → 담당자 → 기한</span></div></div>\n  <div class=\"slotrow ask\"><b>4. 나오는 것</b><div class=\"slotval\"><span class=\"ph mono\" style=\"animation-delay:1.8s\">…</span><span class=\"rv mono\" style=\"animation-delay:1.9s\">비었습니다 — 물어볼게요</span></div></div>\n  <div class=\"slotrow\"><b>5. 내가 볼 곳</b><div class=\"slotval\"><span class=\"ph mono\" style=\"animation-delay:2.2s\">…</span><span class=\"rv mono\" style=\"animation-delay:2.3s\">발송 전 담당자 확인</span></div></div>\n  <div class=\"bubble\" style=\"animation-delay:2.9s;margin-top:10px;margin-bottom:0;font-size:12px;\">결과물은 어떤 모양이어야 하나요? <strong>하나씩만 물어봅니다.</strong></div>\n</div></div></div></div>"},
{notes:"복붙시키고 8분 준다. 돌아가는 동안 AI가 하나씩 물어볼 거라고 미리 말해준다. 한꺼번에 물어보면 초보가 멈춘다.",html:"<div class=\"inner\">\n  <div class=\"kicker\">에이전트 만들기 · 복사해서 붙이기</div>\n  <div class=\"h2\">AI가 먼저 쓰게 하고, 나는 고치기만 합니다</div>\n  <pre class=\"prompt\">02_reference/background.md 를 읽고,\n그 내용을 근거로 03_skills/SKILL.md 를 대신 써줘.\n\n다섯 칸으로 만들어줘.\n1. 이름       이 일을 한 줄로 부르는 이름\n2. 넣는 것     있어야 시작되는 자료와 이 일을 하는 이유\n3. 순서       내가 실제로 밟는 단계를 번호로\n4. 나오는 것   결과물 모양을 예시까지\n5. 내가 볼 곳  내가 마지막에 확인해야 할 지점\n\n규칙:\n- background.md에 있는 내용으로만 채워.\n- 근거가 없는 칸은 비워두고 맨 아래에 \"내가 답해야 할 것\"으로 모아줘.\n- 그 목록은 한 번에 하나씩 물어봐줘. 한꺼번에 다 묻지 마.\n- 추측해서 채우지 마.\n\n다 써준 다음, 내가 꼭 봐야 할 줄 3개만 골라서 알려줘.</pre>\n</div>"},
{notes:"검수 한 번은 반드시 시킨다. 그냥 넘어가면 내 파일이 아니라 AI가 만든 일반론이 된다. 몇 명에게 고친 줄을 소리 내어 읽게 하면 좋다.",html:"<div class=\"inner\">\n  <div class=\"kicker\">에이전트 만들기 · 여러분이 할 일</div>\n  <div class=\"h2\">세 가지만 하면 됩니다</div>\n  <div class=\"g3\" style=\"margin-top:16px;\">\n    <div class=\"card bl\"><div class=\"ctag bl\">01</div><div class=\"ct\">물어보면 답하기</div><div class=\"cb\">AI가 비워둔 칸을 하나씩 물어봅니다. 생각나는 대로 답하면 됩니다.</div></div>\n    <div class=\"card pu\"><div class=\"ctag pu\">02</div><div class=\"ct\">3줄 읽기</div><div class=\"cb\">꼭 봐야 할 줄 3개를 알려줍니다. 그것만 읽어보세요.</div></div>\n    <div class=\"card gr\"><div class=\"ctag gr\">03</div><div class=\"ct\">한 줄 고치기</div><div class=\"cb\">틀린 게 있으면 말로 고쳐달라고 하세요. 타자 칠 일 없습니다.</div></div>\n  </div>\n  <div class=\"bigmsg\"><div class=\"bmlbl\">확인 포인트</div><div class=\"bmtxt\"><span class=\"hl\">한 줄만 고쳐보세요.</span> 그 한 줄이 이게 여러분 거라는 표시입니다.<br/>하나도 안 고쳤으면 아직 읽지 않은 겁니다.</div></div>\n</div>"},
{notes:"오늘 가장 중요한 장표. 여기서 처음으로 에이전트가 실제로 일을 한다. 돌아가는 동안 화면을 바꾸지 말고 그냥 보게 둔다. draft.md가 열리는 순간이 '에이전트를 만들었다'의 증거다. 여기까지 온 사람만 멀티로 넘어갈 수 있으니 손 든 사람 먼저 챙긴다.",html:"<div class=\"inner\" style=\"max-width:1080px;\">\n  <div class=\"kicker\">에이전트 만들기 · 마지막 단계</div>\n  <div class=\"h2\" style=\"font-size:25px;\">이제 한 번 돌립니다. 여기까지가 에이전트 하나입니다</div>\n  <div class=\"sub\">순서를 적어둔 것만으로는 아직 에이전트가 아닙니다. <strong>그 순서대로 실제로 일해서 결과물을 내야</strong> 에이전트입니다.</div>\n  <div style=\"display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start;margin-top:12px;\">\n    <div>\n      <pre class=\"prompt\" style=\"font-size:13px;\">01_input 에 이번에 처리할 자료를 넣었어.\n(자료가 없으면: 내 업무에서 흔한 예시 하나를 네가 만들어서 써)\n\n03_skills/SKILL.md 순서대로 그 일을 한 번 해줘.\n\n결과는 04_output/draft.md 로 저장해줘.\n모르는 건 추측하지 말고 \"확인 필요\"라고 적어둬.</pre>\n      <div class=\"cl gr\">이 한 번이 오늘의 분기점입니다. <strong>draft.md가 열리면 에이전트를 만든 겁니다.</strong></div>\n    </div>\n    <div class=\"demo card-pop\" style=\"animation-delay:.1s\">\n      <div class=\"dlbl\">이 순간을 보세요</div>\n      <div class=\"mono\" style=\"font-size:11.5px;\">\n        <div class=\"fline\" style=\"animation-delay:.4s;color:rgba(255,255,255,.55)\"><i style=\"background:#334155\"></i>SKILL.md 읽는 중</div>\n        <div class=\"fline\" style=\"animation-delay:.9s;color:rgba(255,255,255,.55)\"><i style=\"background:#334155\"></i>background.md 읽는 중</div>\n        <div class=\"fline\" style=\"animation-delay:1.4s;color:rgba(255,255,255,.55)\"><i style=\"background:#334155\"></i>01_input 읽는 중</div>\n        <div class=\"fline\" style=\"animation-delay:1.9s;color:rgba(252,211,77,.9)\"><i style=\"background:#78350F\"></i>순서 3단계 진행 중…</div>\n        <div class=\"fline fn\" style=\"animation-delay:2.6s;font-weight:700;\"><i></i>04_output/draft.md</div>\n      </div>\n      <div class=\"bubble\" style=\"animation-delay:3.2s;margin-top:10px;margin-bottom:0;font-size:12px;\">제가 시킨 순서를 <strong>제가 안 보는 동안</strong> 혼자 밟았습니다. 이게 에이전트입니다.</div>\n    </div>\n  </div>\n</div>"},
{notes:"SKILL.md 한 줄만 새로 켜진다. 에이전트 만들기가 한 일이 딱 이 한 줄이라는 걸 보여주면 \"내가 뭘 한 거지\" 하던 사람이 정리된다.",html:"<div class=\"inner\" style=\"max-width:1120px;\">\n  <div class=\"kicker\">아키텍처 · 에이전트 만들기 끝</div>\n  <div class=\"h2\" style=\"font-size:25px;\">일하는 순서가 파일로 들어왔습니다</div>\n  <div class=\"demo\" style=\"margin-top:12px;padding:14px 18px;\">\n    <div class=\"dlbl\">방 — 일하는 쪽</div>\n    <div style=\"display:flex;gap:12px;align-items:stretch;\"><div class=\"agbox\" style=\"flex:1;animation-delay:0.1s;text-align:center;border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.04);\"><div style=\"font-weight:800;font-size:13px;color:#fff;\">1번 방</div><div style=\"font-size:11px;color:rgba(255,255,255,.55);margin-top:3px;\">순서대로 일합니다</div></div><div style=\"flex:1;border:1px dashed rgba(255,255,255,.16);border-radius:10px;padding:10px 12px;text-align:center;\"><div style=\"font-weight:800;font-size:13px;color:rgba(255,255,255,.22);\">2번 방</div><div style=\"font-size:11px;color:rgba(255,255,255,.18);margin-top:3px;\">멀티에이전트 만들기에서</div></div></div>\n    \n    <div style=\"text-align:center;font-size:12px;color:#A78BFA;margin:10px 0 8px;\">↓&nbsp;&nbsp;1번 방이 이 폴더를 봅니다&nbsp;&nbsp;↓</div>\n    <div class=\"dlbl\">폴더 — 둘이 같이 쓰는 책상</div>\n    <div style=\"background:rgba(0,0,0,.26);border-radius:9px;padding:11px 14px;\"><div class=\"fline\" style=\"animation-delay:0.5s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:rgba(255,255,255,.74);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">내_업무_폴더/</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\"></span></div><div class=\"fline\" style=\"animation-delay:0.5700000000000001s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:rgba(255,255,255,.74);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">├── CLAUDE.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">이 방의 규칙. 모든 대화가 먼저 읽습니다</span></div><div class=\"fline\" style=\"animation-delay:0.64s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:rgba(255,255,255,.74);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">├── 01_input/</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">이번에 처리할 원본 자료</span></div><div class=\"fline\" style=\"animation-delay:0.71s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:rgba(255,255,255,.74);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">├── 02_reference/</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">계속 참고할 기준과 예시</span></div><div class=\"fline\" style=\"animation-delay:0.78s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:rgba(255,255,255,.74);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">│   └── background.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">내 업무 배경 — 지난주 대화에서 옮겨온 것</span></div><div class=\"fline\" style=\"animation-delay:0.8500000000000001s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:rgba(255,255,255,.74);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">├── 03_skills/</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">일하는 순서</span></div><div class=\"fline\" style=\"animation-delay:0.92s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:#C4B5FD;font-weight:700;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">│   └── SKILL.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">다섯 칸짜리 내 업무 순서<span style=\"margin-left:8px;font-size:9.5px;font-weight:800;letter-spacing:.5px;background:#7C3AED;color:#fff;border-radius:4px;padding:1px 5px;vertical-align:1px;\">NEW</span></span></div><div class=\"fline\" style=\"animation-delay:0.99s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:rgba(255,255,255,.74);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">└── 04_output/</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">완성된 결과물</span></div><div class=\"fline\" style=\"animation-delay:1.06s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:rgba(255,255,255,.20);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">    ├── draft.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.20);\">1번 방이 낸 초안</span></div><div class=\"fline\" style=\"animation-delay:1.1300000000000001s;display:grid;grid-template-columns:325px 1fr;gap:10px;padding:1.5px 0;color:rgba(255,255,255,.20);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">    └── review.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.20);\">2번 방이 낸 지적 목록</span></div></div>\n  </div>\n</div>"},
{notes:"사례 B. 다섯 가지를 외우고 있던 게 머릿속 기준이었고, 목록으로 적으니 그대로 쓸 수 있게 됐다. 이 다섯 개가 다음 블록 검사하는 역할의 원형이다.",html:"<div class=\"inner\">\n  <div class=\"kicker\">실제 사례 B</div>\n  <div class=\"h2\">외우고 있던 다섯 가지를 목록으로 적었을 뿐인데</div>\n  <div class=\"sub\">규정 담당자 · 규정 개정안을 볼 때마다 머릿속으로 돌리던 다섯 가지 관점</div>\n  <div class=\"ba\" style=\"margin-top:12px;\">\n    <div class=\"bef\"><div class=\"balbl b\">적기 전</div><div class=\"batask\">사람마다 빠뜨리는 게 달랐습니다</div><div class=\"babody\">다섯 가지가 머릿속에만 있어서 매번 처음부터 다시 생각했고, 바쁘면 한두 개를 빠뜨렸습니다.</div></div>\n    <div class=\"aft\"><div class=\"balbl a\">적은 뒤</div><div class=\"batask\">항상 다섯 개가 다 나옵니다</div><div class=\"babody\">개정안 파일을 넣으면 다섯 관점별로 검토 의견 초안이 나옵니다. 최종 제출 전 본인 확인은 그대로 남겼습니다.</div></div>\n  </div>\n  <div class=\"g3\" style=\"margin-top:12px;\">\n    <div class=\"card sl\"><div class=\"cb\"><strong>1</strong> 상위 법령과 어긋나지 않는가<br/><strong>2</strong> 예산과 맞는가</div></div>\n    <div class=\"card sl\"><div class=\"cb\"><strong>3</strong> 현장에서 실제로 되는가<br/><strong>4</strong> 빠져나갈 구멍은 없는가</div></div>\n    <div class=\"card sl\"><div class=\"cb\"><strong>5</strong> 기관 방향과 맞는가</div></div>\n  </div>\n  <div class=\"cl pu\">이 다섯 개가 잠시 뒤 <strong>검사하는 사람</strong>이 볼 기준이 됩니다.</div>\n</div>"},
{notes:"간지. 3초만 띄우고 넘어간다. 여기부터가 멀티에이전트입니다.",html:"<div class=\"inner\" style=\"max-width:1000px;\">\n  <div style=\"display:flex;align-items:center;gap:26px;\">\n    <div style=\"font-size:92px;font-weight:900;line-height:1;color:rgba(124,58,237,.35);letter-spacing:-3px;\">04</div>\n    <div style=\"flex:1;\">\n      <div class=\"kicker\" style=\"margin-bottom:6px;\">오늘 ② · 36–52분</div>\n      <div class=\"h2\" style=\"font-size:40px;line-height:1.25;\">멀티에이전트를 만듭니다</div>\n      <div style=\"height:3px;width:74px;background:#7C3AED;border-radius:2px;margin:16px 0 14px;\"></div>\n      <div class=\"sub\" style=\"font-size:16px;\">여기부터가 멀티에이전트입니다.</div>\n    </div>\n    <div class=\"agbox\" style=\"min-width:130px;text-align:center;animation-delay:.2s;\">\n      <div style=\"font-size:11px;color:rgba(255,255,255,.45);\">지금까지</div>\n      <div style=\"font-size:26px;font-weight:900;color:#fff;margin-top:4px;\">agent 1 → 2</div>\n    </div>\n  </div>\n</div>"},
{notes:"어려운 이름 쓰지 않는다. \"방을 하나 더 연다\"로만 말한다. 1번 방은 지금 쓰던 창 그대로, 2번 방은 Code 탭에서 같은 폴더로 새 세션. 화면에서 새 세션 만드는 걸 한 번 보여주고 넘어간다.",html:"<div class=\"inner\">\n  <div class=\"kicker\">멀티에이전트 만들기 · 36–52분 · 16분</div>\n  <div class=\"h2\">방을 하나 더 엽니다</div>\n  <div class=\"sub\">여기까지가 agent 하나입니다. 자기가 쓴 걸 자기가 보면 틀린 걸 못 찾습니다. <strong>방을 하나 더 열어서, 그 방에 검사만 시킵니다.</strong></div>\n  <div style=\"display:grid;grid-template-columns:1.15fr .95fr;gap:22px;align-items:start;margin-top:12px;\">\n    <div>\n      <div class=\"g2\" style=\"margin-top:0;\">\n        <div class=\"card bl\"><div class=\"ctag bl\">1번 방 — 지금 쓰던 창</div><div class=\"ct\">초안을 씁니다</div><div class=\"cb\">방금 만든 SKILL.md 순서대로 작업해서 <strong>04_output/draft.md</strong>를 냅니다.</div></div>\n        <div class=\"card pu\"><div class=\"ctag pu\">2번 방 — 새로 여는 창</div><div class=\"ct\">어긋난 곳만 찾습니다</div><div class=\"cb\"><strong>같은 폴더</strong>로 세션을 하나 더 엽니다. draft.md를 읽고 지적만 해서 <strong>review.md</strong>를 냅니다.</div></div>\n      </div>\n      <div class=\"cl am\">고칠지 말지는 <strong>내가</strong> 정합니다. 밖으로 나가는 일은 여기서 반드시 멈춥니다.</div>\n    </div>\n    <div><div class=\"demo card-pop\" style=\"animation-delay:.1s\">\n      <div class=\"dlbl\">둘이 이렇게 돕니다</div>\n      <div style=\"display:grid;grid-template-columns:1fr 26px 1fr;gap:8px;align-items:center;\">\n        <div class=\"agbox a1\"><div style=\"font-weight:800;color:#fff;font-size:13px;\">1번 방</div>\n          <div style=\"font-size:11.5px;color:rgba(255,255,255,.55);margin-top:3px;\">순서대로 초안</div>\n          <div class=\"fline fn mono\" style=\"animation-delay:1.4s;font-size:11.5px;margin-top:6px;\"><i></i>draft.md</div></div>\n        <div style=\"text-align:center;color:rgba(255,255,255,.3);font-size:18px;\">→</div>\n        <div class=\"agbox a2\"><div style=\"font-weight:800;color:#fff;font-size:13px;\">2번 방</div>\n          <div style=\"font-size:11.5px;color:rgba(255,255,255,.55);margin-top:3px;\">어긋난 곳만 지적</div>\n          <div class=\"fline fn mono\" style=\"animation-delay:3.2s;font-size:11.5px;margin-top:6px;\"><i></i>review.md</div></div>\n      </div>\n      <div class=\"bubble\" style=\"animation-delay:3.8s;margin-top:10px;margin-bottom:0;font-size:12px;\">draft.md는 <strong>그대로입니다.</strong> 지적만 했고 고치지 않았습니다.</div>\n    </div></div>\n  </div>\n</div>"},
